name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
  schedule:
    # Nightly, and the only thing that asks the population.
    - cron: '0 18 * * *'

permissions:
  contents: read

jobs:
  # What a pull request and a push wait on: everything except the tests whose subjects are the
  # models this repository carries. Those are the job below, and nobody waits on them.
  #
  # Not on a schedule: the job below runs everything this one runs and the population besides, so
  # the two together would build the reactor twice over and answer the same question the second
  # time.
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        # Two, because that is what the runner has. The number in the pom is a ceiling for a
        # machine somebody is also working on, and a runner is nobody's.
        run: mvn -B --no-transfer-progress verify -DforkCount=2

  # And the population, asked where waiting for it costs nobody an edit: once a night, and nowhere
  # a change is on its way in. Emptying the property is what asks them; everything the job above
  # runs is run here too, so this is the whole suite and not the remainder of it.
  #
  # A scheduled run is made against the default branch and no other, so the branches a day's work
  # lands on are named here and checked out by name. What a merge into `develop` left behind is
  # found by the morning, and against the commit the day ended on rather than the one that broke
  # it.
  population:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        branch: [ develop, main ]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test ${{ matrix.branch }}, the population included
        run: mvn -B --no-transfer-progress verify -DforkCount=2 -Dtest.excluded.groups=
