# --- attempted construction (E2012, `if T(v) as x` / `guard T(v) as x`) ---
check.attempt.title=試みられない構築
attempt.this-is-not-a-construction=`as` は構築した値に名前を付けるものですが、これは構築ではありません。
attempt.write-the-construction-whose-invariant-decides=分岐を決める invariant を持つ構築を書くか、`as` をやめて条件を書いてください。
attempt.the-type-declares-no-invariant=`{data}` は invariant を宣言していないため、試みる構築は必ず成功し、`else` の値には到達しません。
attempt.construct-it-directly-or-give-it-an-invariant=`{data}` をそのまま構築するか、分岐を決める invariant を与えてください。
attempt.nothing-here-is-attempted=これらのアームは invariant の句ひとつずつに答えるものですが、答える対象となる試みる構築がここにありません。
attempt.attempt-the-construction-or-give-the-else-one-value=構築を試みる形（`guard T(v) as x else ...`）にするか、`else` に値をひとつ書いてください。
attempt.the-clause-is-answered-twice=句 `{clause}` に二度答えています。アームは失敗した句で選ばれるので、二つ目には到達しません。
attempt.no-clause-of-that-name=`{data}` に `{clause}` という名前の invariant の句はありません。
attempt.the-clauses-that-can-be-answered=名前で答えられる句は {clauses} です。句の名前は宣言側で付けます（`invariant <名前> = ...`）。名前のない句には `| _ -> ...` で答えます。
attempt.these-clauses-have-no-arm=`{data}` の次の句にアームがありません: {clauses}。失敗はどれかひとつのアームに届くので、失敗しうる句すべてにアームが必要です。
attempt.answer-each-of-them-or-give-the-else-one-value=それぞれに答えるか、`else` に値をひとつ書いてください。値ひとつはどの失敗にも答えます。
attempt.unnamed-clauses-are-left-unanswered=`{data}` には名前のない invariant の句があり、それに答えるものがありません。
attempt.add-a-catch-all-arm-or-name-them=`| _ -> ...` を足すか、宣言側で名前を付けてください。
attempt.the-catch-all-arm-answers-nothing=`{data}` の invariant の句はすべて名前付きで答えられているので、`| _ -> ...` は何にも答えません。
attempt.drop-the-catch-all-arm=削除してください。`{data}` が名前のない句を宣言した時点で再び必要になります。

# 値の循環
check.value.cycle.title=値の循環
name.a-value-reaches-itself=`let {name}` が自分自身を通じて定義されています（{through}）。値は名前を書いた位置に置換されるので、自分に戻る値は置換するものがありません。helper が再帰できるのはメソッドに落ちるからで、値にはその形がありません。
