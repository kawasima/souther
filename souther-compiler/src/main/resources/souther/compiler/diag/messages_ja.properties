module.an-exposed-argument-rests-on-what-is-kept=`{exposed}` は公開されていますが、引数 `{argument}` の型 `{type}` は公開されていません。

# --- JVM が保持できる大きさ (E2101, E2102, E2103) ---
e2101.title=生成メソッドが JVM の引数スロット上限を超える
declaration.a-data-needs-more-slots-than-a-constructor-holds=`data {data}` は JVM の引数スロットを {needs} 必要としますが、生成されるコンストラクタが取れるのは最大 {holds} です。`Int` のフィールドは `long` として運ばれるので2スロット、それ以外のフィールドは1スロットです。
declaration.split-the-data-and-hold-them-as-fields=`{data}` を小さな data に分割し、フィールドとして持たせてください。
declaration.a-behavior-takes-more-parameters-than-apply-holds=`behavior {behavior}` は引数を {takes} 取りますが、生成される `apply` メソッドが取れるのは最大 {holds} です。
declaration.group-the-parameters-into-a-data=引数を data にまとめ、それを取るようにしてください。
declaration.a-behavior-has-more-dependencies-than-a-constructor-holds=`behavior {behavior}` は依存を {has} 受け取って組み立てられますが、生成されるコンストラクタが取れるのは最大 {holds} です。
declaration.group-the-dependencies-behind-a-behavior=依存をまとめる behavior を用意し、そちらに依存してください。
declaration.a-helper-takes-more-parameters-than-a-method-holds=`let {helper}` は引数を {takes} 取りますが、生成されるメソッドが取れるのは最大 {holds} です。
e2102.title=生成メソッドが JVM のコードサイズ上限を超える
declaration.a-method-is-larger-than-the-jvm-holds=`{owner}` に対して生成される `{method}` メソッドはコードが {bytes} バイトですが、JVM のメソッドが保持できるのは最大 {holds} バイトです。
declaration.split-the-work-or-move-the-table=処理を別の behavior に分けてください。別クラスとして生成されます。あるいは表データをソースの外に移してください。`let` で名前を付けても分割にはなりません。非再帰の helper は生成前に inline されます。
e2103.title=生成クラスが JVM の定数プール上限を超える
e2104.title=ソースが深すぎる
e2108.title=コンパイラが処理しきれなかった
declaration.the-compiler-ran-out-of-room=処理の途中で足りなくなりました。ソースの入れ子の深さも定義が持てる構造の量もそれぞれ上限があり、超えたものは場所を示して拒否されます。つまりこれはソースについての報告ではありません。このコンパイラがサポートするスタック上では、受理したソースから作られるものがここまで深くなることはないはずです。与えられたスタックがそれより小さいか、上限がまだ押さえられていない形かのどちらかです。
e2107.title=定義がコンパイラの保持できる複雑さを超える
declaration.a-block-takes-more-structural-steps-than-a-definition-holds=このブロックは {steps} 段の構造を進みますが、1つの定義が保持できるのは最大 {holds} 段です。ある文より後はすべてその文が導入したものの内側に書かれるため、1段ずつ増えます。`guard` は名前を束縛しませんが、同じく1段です。
declaration.a-definition-is-more-structure-than-is-held=`let {definition}` は構造が {costs} 段ですが、1つの定義が保持できるのは最大 {holds} 段です。
declaration.substituting-a-value-is-more-structure-than-is-held=ここで `{value}` を代入すると、1つの定義が保持できる {holds} 段を超えます。値は名前が書かれた場所に代入されるので、その値の分が名前を書いた側に加わります。
declaration.write-it-as-a-behavior-of-its-own=最も多くを言っている部分を独立した behavior として書いてください。behavior はそれ自体が1つの定義で、別に数えられます。`let` で名前を付けても減りません。ブロックの文も値の代入も、どちらも数えられます。
declaration.a-class-refers-past-the-constant-pool=`{owner}` に対して生成されるクラスは定数プールのエントリ {refersTo} を参照しますが、クラスファイルが指せるのは最大 {holds} です。プールにはクラスが参照する名前・型・リテラルがすべて入ります。
declaration.a-class-needs-more-constants-than-it-holds=`{owner}` に対して生成されるクラスは定数プールのエントリを {needs} 必要としますが、クラスファイルが保持できるのは最大 {holds} です。プールにはクラスが参照する名前・型・リテラルがすべて入ります。
declaration.move-the-table-out-of-the-source=表データをソースの外に移すか、処理を別の behavior に分けてください。定数は別クラスのものになります。

example.the-table-spent-its-steps=`fake {fake}` のテーブルの構築が {budget} ステップの予算を使い切ったので、これが述べていることは何も検査されていません。
example.the-table-goes-round-too-many-times=テーブルの行が、example に許された回数より多く回るヘルパを適用しています。回数を押さえるか、行が構築するものを小さくしてください。それまで、`fake {fake}` のテーブルが構築できるかどうかは不明です。
example.the-table-reached-its-depth-limit=`fake {fake}` のテーブルの構築が再帰深度の上限 {limit} に達したので、これが述べていることは何も検査されていません。
example.the-table-recurses-too-deeply=テーブルが適用するヘルパが、example に許された深さを超えて再帰しています。構造的にするか、行が構築するものを小さくしてください。それまで、`fake {fake}` のテーブルが構築できるかどうかは不明です。
example.the-table-did-not-answer=`fake {fake}` のテーブルの構築が {within}ms 以内に応答しなかったので、これが述べていることは何も検査されていません。
example.the-table-not-answering-is-not-the-table-being-wrong=これはテーブルが構築できなかったのではなく、評価が応答しなかったということです。戻ってこなかったのは計数の届かないコンパイラ自身の作業なので、`fake {fake}` のテーブルが間違っているとは何も言えません。
example.not-compared-the-table-spent-its-steps=この fake と `{behavior}` に記録された行を照合できませんでした。テーブルの構築が {budget} ステップの予算を使い切りました。
example.the-table-compared-goes-round-too-many-times=テーブルの行が、example に許された回数より多く回るヘルパを適用しています。回数を押さえるか、行が構築するものを小さくしてください。それまで、この fake と `example {behavior}` の行が一致するかは不明です。
example.not-compared-the-table-reached-its-depth-limit=この fake と `{behavior}` に記録された行を照合できませんでした。テーブルの構築が再帰深度の上限 {limit} に達しました。
example.the-table-compared-recurses-too-deeply=テーブルが適用するヘルパが、example に許された深さを超えて再帰しています。構造的にするか、行が構築するものを小さくしてください。それまで、この fake と `example {behavior}` の行が一致するかは不明です。
example.not-compared-the-table-did-not-answer=この fake と `{behavior}` に記録された行を照合できませんでした。テーブルの構築が {within}ms 以内に応答しませんでした。
example.not-answering-is-not-two-answers=これはモデルが二つのことを言っているのではなく、評価が応答しなかったということです。戻ってこなかったのは計数の届かないコンパイラ自身の作業なので、fake と `example {behavior}` の行が矛盾しているとは何も言えません。

example.the-evaluation-did-not-answer=この行の評価が {within}ms 以内に応答しなかったので、打ち切りました。
example.not-answering-is-not-not-terminating=これはモデルが停止しないのではなく、コンパイラが判定できなかったということです。戻ってこなかったものは計数されていないので、この行が成り立たないとは何も言えません。この待ち時間が計るのはコンパイラ自身の作業（クラスの読み込み、値の復号、jar から読んだモジュール）であって、Java から供給された実装が応答に使った時間ではありません。
example.the-stack-ran-out-before-the-depth-limit=この行の評価が、再帰深度の上限 {limit} に達する前に JVM のスタックを使い切りました（{stack}）。
example.the-depth-limit-is-what-should-stop-it=再帰を止めるのは深度の上限のはずが、スタックが先に尽きました。深度の上限を下げるか、評価に与えるスタックを大きくするか、ヘルパを末尾再帰に書き換えてフレームを積まないようにしてください。

example.the-table-ran-out-of-stack=`fake {fake}` のテーブルの構築が、再帰深度の上限 {limit} に達する前に JVM のスタックを使い切ったので、これが述べていることは何も検査されていません。
example.the-stack-got-there-first=再帰を止めるのは深度の上限のはずが、スタックが先に尽きました。深度の上限を下げるか、評価に与えるスタックを大きくするか、`fake {fake}` のテーブルが適用するヘルパを末尾再帰に書き換えてください。
example.not-compared-the-table-ran-out-of-stack=この fake と `{behavior}` に記録された行を照合できませんでした。テーブルの構築が、再帰深度の上限 {limit} に達する前に JVM のスタックを使い切りました。
example.the-stack-got-there-first-when-comparing=再帰を止めるのは深度の上限のはずが、スタックが先に尽きました。深度の上限を下げるか、評価に与えるスタックを大きくするか、テーブルが適用するヘルパを末尾再帰に書き換えてください。それまで、この fake と `example {behavior}` の行が一致するかは不明です。

example.the-evaluation-spent-its-steps=この行の評価が、{budget} ステップの予算内で終わりませんでした。
example.spending-the-budget-is-not-diverging=計数が示しているのは評価が終わらなかったことで、モデルが停止しないことではありません。止まらない `partial` な再帰もここに来ますし、あと少しで止まったものも来ます。モデルが実際に停止していてもっと必要なら `souther.example.step.limit` を上げてください。そうでなければループを押さえるか、再帰を構造的にしてください。
example.the-evaluation-reached-its-depth-limit=この行の評価が、再帰深度の上限 {limit} に達しました。
example.reaching-the-depth-limit-is-not-diverging=計数が示しているのは再帰が上限より深く進んだことで、底に到達しないことではありません。データが本当にそれだけ深いなら `souther.example.recursion.depth` を上げてください。そうでなければ引数の一部で再帰して底に到達するようにしてください。
# --- where a report's caret stands in for code this compile has no source for ---
written-at.the-code-is-written-out-of-sight=そのコードは `{declaration}` に書かれていて、このコンパイルはそのソースを持っていません。ここは書かれた場所ではなく、そこへ到達した場所です。
written-at.the-code-is-written-where-this-compile-cannot-show-it=そのコードは `{declaration}` に書かれていて、このコンパイルはそのソースを持っていません。ここには指し示せる場所がありません。

cli.help.command=`souther` に `{0}` というコマンドはありません。
cli.help.arguments=`souther help` は1つのコマンドについて書きますが、{0} が指定されています。

# --- an `unreachable` at a case the model admits (E1326) ---
check.unreachable.title=到達しうる unreachable
unreachable.the-model-admits-this-case=`{caseName}` は `{position}` に来うるので、この位置は到達可能です。
unreachable.it-is-a-case-of=`{caseName}` は `{type}` の case であり、ここでそれを拒む規則はありません。
unreachable.answer-a-value-or-change-the-input=モデルが入力として認める組み合わせなら、その arm は値を答えるか、入力の型を変えます。`unreachable` はモデルが除外しているものに使います。
# --- a branch the model's own rules make dead (E1327) ---
check.dead.branch.title=到達しない分岐
dead-branch.nothing-reaches-this-branch=この分岐にはモデルが認める値が何も到達しないため、ここを通る行は書けません。
dead-branch.the-conditions-on-the-way-here-cannot-all-hold=ここへ至る条件は同時に成り立ちません: {conditions}。
dead-branch.the-position-stops-short-of-it=`{position}` が取りうるのは {admits} なので、この分岐が対象とする値は取りえません。
dead-branch.every-case-it-is-written-for-is-refused=`{position}` に {cases} の値を残す規則がないため、それらの値はここに来ません。
dead-branch.take-it-out-or-let-something-reach-it=分岐を削るか、到達するものを広げてください。分岐を排除しているのはこの分岐ではなくモデルの規則です。
