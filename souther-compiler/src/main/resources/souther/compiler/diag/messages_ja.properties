# --- souther run（コマンドラインが behavior を1つ駆動する。コンパイルエラーではない） ---
run.usage.line=使い方: souther run <file.sou> [-cp <パス>] [--behavior <名前>] [--input <json>]
run.usage.singlefile=run が取る .sou ファイルは1つです。
run.usage.nofile=ソースファイルが指定されていません。
run.usage.optionvalue=`{0}` には値が必要です。
run.behavior.none=このモジュールには `run` で動かせる behavior がありません。動かせるのは、Souther 側に実装があって注入を必要とせず（`>->` なら全ステージがそうであり）、かつモジュールが exposing で公開している behavior です。
run.behavior.several=`run` で動かせる behavior が複数あります。--behavior で1つ選んでください: {0}
run.behavior.runnable=`{0}` は実行できます。`run` で動かせる behavior: {1}
run.behavior.noimpl=`{0}` には実装がありません（Java から注入されます）。`run` で動かせる behavior: {1}
run.behavior.unwritten=`{0}` は依存するものを宣言していて `let` がまだ無いので、動かすものがありません。`run` で動かせる behavior: {1}
run.behavior.depends=`{0}` は注入依存（{1}）を必要とし、`run` はそれを供給できません。`run` で動かせる behavior: {2}
run.behavior.unknown=`{0}` という behavior はありません。`run` で動かせる behavior: {1}
run.behavior.notexposed=`{0}` は公開されていません。`run` が動かすのはモジュールが公開している behavior です。`exposing` に追加してください。`run` で動かせる behavior: {1}
run.behavior.failed=`{0}` が失敗しました: {1}
run.behavior.unreachable=`{0}` を起動できませんでした。生成された `{1}` に到達できません: {2}。これはモジュールではなくコンパイラ側の欠陥です。
run.pipeline.noimpl=`{0}` はパイプラインで、ステージ `{1}` に実装がありません（Java から注入されます）。`run` はそれを供給できません。`run` で動かせる behavior: {2}
run.pipeline.depends=`{0}` はパイプラインで、ステージ `{1}` が注入依存（{2}）を必要とします。`run` はそれを供給できません。`run` で動かせる behavior: {3}
run.input.missing=`{0}` は入力を {1} 個取ります。--input を渡してください。
run.input.notarray=`{0}` は入力を {1} 個取ります。--input はその長さの JSON 配列にしてください。
run.input.count=`{0}` は入力を {1} 個取りますが、--input には {2} 個あります。
run.input.wrapped=この behavior のパラメータは1つです。--input には値を直接指定し、外側の配列を取り除いてください。
run.input.badjson=--input が正しい JSON ではありません: {0}
run.input.toodeep=--input はこの境界が受け取れる深さを超えています: {0} 以下（JSON の入れ子が {1} レベルを超えました）。data の1レベルが JSON の複数レベルを使うことがあります。
run.decode.failed=入力 #{0} をデコードできませんでした — {1}
run.encode.toodeep=出力が深く入れ子になりすぎていて、この境界ではエンコードできません。
run.read.failed={0} を読めません: {1}
run.output.json=出力を JSON にできませんでした: {0}
run.output.toodeep=出力はこの境界が書き出せる深さを超えています: {0} 以下（JSON の入れ子が {1} レベルを超えました）。data の1レベルが JSON の複数レベルを使うことがあります。
run.decode.malformed=入力 #{0} は `{1}` の形になっていません。--input を確認してください。

