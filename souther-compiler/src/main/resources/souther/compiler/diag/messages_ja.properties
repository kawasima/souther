# --- totality (E2001, サイズ変化停止性) ---
check.totality.title=TOTALITY
behavior.not-structurally-recursive=再帰ヘルパ `let {helper}` は構造的再帰ではありません。パラメータの真に小さい部分を引数に渡していません。`match`（フィールドやケース）で取り出した部分に再帰するか、`fold` で数え上げるか、`partial` を付けてください。
behavior.not-size-change-terminating=再帰ヘルパ {helpers} は相互再帰ですが、サイズ変化停止性を満たしません。どの再帰サイクルでも真に減少する引数がありません。`match`（フィールドやケース）で取り出した真に小さい部分に再帰するか、全員に `partial` を付けてください。互いに到達するので、一人だけでは足りません。
behavior.too-complex-to-prove-total=再帰 {helpers} はサイズ変化解析で全域性を証明するには複雑すぎます。全員に `partial` を付けてください。
behavior.it-reaches-a-partial-helper=`let {helper}` は主張する停止性を保証できません。`partial` ヘルパ `{partial}` に到達しています（{through}）。`{helper}` にも `partial` を付けるか、到達しないようにしてください。
behavior.a-partial-helper-is-written-where-a-value-goes=`partial` ヘルパ `{helper}` が値の位置に書かれています。関数型は停止性を保証しないので、`partial` ヘルパは適用はできますが受け渡しはできません。

