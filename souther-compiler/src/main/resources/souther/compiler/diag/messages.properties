# --- rewritten high-value messages (Elm-style: found/expected, secondary regions, hints) ---

# type mismatch (a value does not have the type its position requires)
check.type.mismatch.title=TYPE MISMATCH
type.it-does-not-have-the-type-it-needs-here={what} does not have the type it needs here.
type.adjust-the-value-or-the-position=Adjust the value so its type matches, or change what this position expects.

# the two branches of an `if` disagree
type.the-branches-of-this-if-disagree=The two branches of this `if` produce different types, so the `if` has no single type.
type.the-then-branch-produces=the `then` branch produces {type}
type.the-else-branch-produces=the `else` branch produces {type}
type.this-branch-and-the-preceding-ones=This branch produces {branch}. The preceding branches produce {preceding}.
type.make-both-branches-produce-one-type=Make both branches produce the same type — wrap one in the case you meant, or handle it upstream.

# non-exhaustive match (E1201)
declaration.the-match-does-not-cover-every-case=This `match` on {subject} does not cover every case.
declaration.add-a-case-for=Add a case for: {cases}

# unknown names (with a did-you-mean suggestion)
check.constraint.title=UNSATISFIED CONSTRAINT
check.notcallable.title=BEHAVIOR NOT CALLABLE HERE
check.unknown.title=NAMING ERROR
declaration.it-cannot-be-held-as-a-value-here=`{name}` is {what}, and cannot be held as a value here.
name.no-value-of-that-name-in-scope=I cannot find a value named `{name}` in scope.
name.it-is-exposed-by-another-module=`{module}` exposes `{name}`. Reach it as `{module}.{name}`, or name it in an import of `{module}`.
name.no-type-of-that-name=I cannot find a type named `{name}`.
name.no-behavior-of-that-name-in-this-pipeline=I cannot find a behavior named `{name}` in this pipeline.

# list elements disagree on type
check.list.title=TYPE MISMATCH
type.this-element-and-the-preceding-ones=This element has type {element}. The preceding elements have type {preceding}.
type.the-two-lists-hold-different-elements=`++` joins two lists into one, so the elements of both must have one type.
type.this-list-holds-elements-of=this list holds elements of {element}
type.make-every-element-the-same-type=Make every element the same type — widen them to a sum they are cases of, or convert the one that differs.

# a local binding's type annotation (`let x: T = e`)
name.the-binding-declares-another-type=The binding `{binding}` declares {declares}, but its value is {value}.

# a fold over an empty-collection seed whose accumulator type cannot be inferred from context
check.fold.seed.title=CANNOT INFER TYPE
name.the-element-type-cannot-be-inferred-here=This empty collection's element type cannot be inferred here. Annotate the binding it feeds (`let x: <type> = ...`), place the fold directly in a typed position — the field or behavior output it feeds — or seed it with a non-empty value.
name.the-accumulators-type-stays-unknown=the accumulator's type stays unknown, so this operation has nothing to work on

# binary / unary operand types
type.joins-two-lists-or-two-strings=`++` joins two lists or two strings, but the operands are {one} and {other}.
type.these-two-cannot-be-compared=These two values cannot be compared: {one} and {other}.
type.unary-minus-needs-a-number=Unary minus needs an Int or a Decimal, but this is {given}.
declaration.this-operand-is=this is {type}

# behavior composition type mismatch (E1701)
declaration.these-behaviors-cannot-be-composed=These behaviors cannot be composed: the left behavior's output is not accepted by the right behavior's input.
declaration.make-the-left-output-a-case-the-right-accepts=Make the left output a case the right behavior accepts, or handle the extra cases before this stage.

# --- coded declaration errors ---

# construction authority (E1002 too few, E1006 too many)
declaration.it-constructs-without-declaring-it=Behavior `{behavior}` constructs `{data}` but does not declare `constructs {data}`.
declaration.add-the-constructs-entry=Add `constructs {data}` to `{behavior}`, or stop constructing {data} here.
declaration.it-declares-constructs-and-never-builds=Behavior `{behavior}` declares `constructs {data}` but never builds {data}; it passes an existing value through.
declaration.remove-the-constructs-entry=Remove `{data}` from the `constructs` clause.
declaration.it-names-a-unit-data-in-constructs=Behavior `{behavior}` names `{data}` in `constructs`, but a unit data is not part of a construction set.

# depends on (E1602 missing, E1603 extra)
declaration.it-calls-something-with-no-implementation=`let {let}` calls `{called}`, which has no implementation, but `behavior {behavior}` does not declare `depends on {called}`.
declaration.add-the-depends-on-entry=Add `depends on {called}` to `behavior {behavior}`.
declaration.it-declares-depends-on-and-never-calls-it=`behavior {behavior}` declares `depends on {dependency}`, but `let {let}` never calls it.
declaration.remove-the-depends-on-entry=Remove `{dependency}` from the `depends on` clause.

# `null` written as a name (E1301)
declaration.null-is-not-part-of-the-language=`null` is not part of the language. Use an optional field with `?`.

# a cycle among the modules being compiled (E1501)
declaration.cyclic-module-dependency=Cyclic module dependency detected.

# `Some` / `None` written where no `?` field is being given a value (E1303)
declaration.some-is-not-a-call=`Some(...)` is not a call: a value written into a `?` field is wrapped for you, and that is the only place an optional is made.
declaration.write-the-value-on-its-own=Where a `?` field is being given a value, write the value on its own. Elsewhere an optional is only read — a `?` field, `Map.get`, `List.find` — never made.
declaration.nothing-here-is-asking-for-none=`None` is the empty value of a `?` field, and nothing here is asking for one.
declaration.make-absence-a-case-of-its-own-sum=Where the model owns the absence, make it a case of its own sum. Absence of that kind does not reach `List.filterMap`, whose step has to answer an optional: use `List.flatMap` over a step answering a list of nought or one.

# `unreachable` where the position states no type (E1307)
name.nothing-says-what-this-position-holds=Nothing here says what this position holds, and `unreachable` answers no value to say it with.
name.write-it-where-the-type-is-stated=Write it where the type is stated — an arm beside one that answers a value, a field, a declared return, an annotated binding.

# injected behavior constructs an uncreatable data (E1305)
declaration.an-injected-behavior-constructs-what-is-kept=Injected behavior `{behavior}` declares `constructs {data}`, but {data} is not exposed, so Java cannot build it.
declaration.expose-it=Expose {data}.

# composition output declaration vs inference (E1604) and output signature (E1605)
declaration.the-declared-output-is-not-what-the-pipeline-produces=behavior {behavior} declares its output as {declared}, but the pipeline produces {produces}.
declaration.update-the-output-or-handle-the-case=Update the declared output, or handle the extra case before the output.
declaration.only-a-composition-takes-an-output-signature=`exposing` gives an output signature to `{name}`, which is not a composition (`>->`); only a composition needs one.
declaration.an-exposed-composition-declares-its-output=Exposed composition `{composition}` must declare its output in `exposing`.
declaration.write-the-output-signature=Write `exposing ( {composition} : {output} )`.

# a `depends on` that does not name an injection target (E1607)
declaration.depends-on-names-something-that-depends-on-nothing=`behavior {behavior}` declares `depends on {dependency}`, but `{dependency}` depends on nothing, so there is nothing to inject.
declaration.remove-it-and-call-it-directly=Remove `{dependency}` from `depends on` and call it directly; a behavior that depends on nothing is reached by name.
declaration.depends-on-names-no-such-behavior=`behavior {behavior}` declares `depends on {dependency}`, which is not a behavior in scope with a requirement of its own.
declaration.declare-it-here-or-import-it=Declare `behavior {dependency}` with no `let` here, or import it from the module that declares it.
declaration.depends-on-names-a-composition=`behavior {behavior}` declares `depends on {dependency}`, but `{dependency}` is a `>->` composition.
declaration.a-compositions-requirements-are-not-written=Remove `{dependency}` from `depends on`. A composition's requirements are decided by its stages and are not written, so a caller cannot rest on them; compose with it, or depend on what its stages depend on.

# spread field collisions (E1004) and a construction that leaves a field with no value (E1005).
# One rule, and a hint per way of breaking it: which of these the reader gets is decided by what the
# construction was written with, so a source with no spread is never told about one.
data.spread-field-collision=Field `{field}` from `...{from}` conflicts with the one `{heldBy}` supplies.
data.construction-is-missing-a-field=Construction of `{data}` is missing field `{field}`.
data.give-the-field-a-value=Give `{field}` a value: write `{field} = …`, or write `{field}` alone to fill it from a binding of that name.
data.supply-the-field-explicitly=Supply `{field}` explicitly; the spread does not provide it.
data.the-field-is-not-in-what-the-sum-shares=`{field}` is not in the part every case of `{sum}` spreads, so the spread does not provide it. Supply it explicitly, or open `{sum}` with `match` and read it from the case that has it.
data.the-field-is-in-the-shared-part-of-none-of-these=A spread of a sum provides the part every case of it spreads, and `{field}` is in that part of none of these: {sums}. Supply it explicitly, or open the sum whose case has it with `match`.

# invariant type (E1101)
declaration.an-invariant-expression-is-bool=An invariant expression must have type Bool, but this is {given}.

# a behavior reached from where one is not called (E1818) and stdlib qualifier
behavior.a-behavior-cannot-be-called-from-here=`{behavior}` is a behavior, and it cannot be called from here.
behavior.what-reaches-a-behavior=A helper `let` does not reach a behavior, and a `>->` composition is composed with rather than called. Call `{behavior}` from a behavior's own `let` and pass the result in.
check.construct.position.title=CONSTRUCTION NOT ALLOWED HERE
data.a-construction-cannot-be-written-here=`{data}` is a type, so `{data}(...)` constructs one, and a construction cannot be written here.
check.apply.notfunction.title=NOT A FUNCTION
name.it-is-not-a-function-here=`{name}` is not a function here, so it cannot be applied to arguments.
name.write-it-on-its-own=Write `{name}` on its own.
name.a-name-the-language-gives-is-not-a-function=`{name}` is a name the language gives, not a function, so it cannot be applied to arguments.
name.write-a-standard-library-name-qualified=`{name}` is a standard-library name. Write it qualified ({qualified}) or import the name you mean.

# stdlib argument-type checks (expected container kind is a localized phrase)
kind.list=a List
kind.map=a Map
kind.set=a Set
kind.option=an Option
kind.ordered.list=a list of ordered values (Int, String, Decimal, Date, Time, DateTime, Instant, a newtype over one of these, or an enumeration — a sum every one of whose cases is a unit data, ordered by its declaration)
kind.numeric.list=a list of Int or Decimal
declaration.it-expects-another-type=`{what}` expects {expects}, but got {got}.
declaration.it-needs-an-ordered-element=`{call}` needs {needs}, but the element is {element}.
type.map-to-an-ordered-field-first=Map to an ordered field first, then sort or compare that.
type.the-key-must-be-an-ordered-value=`{call}`'s key must be an ordered value, but it returns {returns}.
declaration.it-needs-a-numeric-element=`{call}` needs {needs}, but the element is {element}.
type.map-to-the-numeric-field-first=Map to the numeric field first, then apply `{call}` to that. A newtype over Int or Decimal is not a numeric element: it declares no arithmetic of its own, and no value to start from.
type.over-the-empty-list-the-seed-decides=`{call}` over the empty list answers with its seed, and whether that seed is an Int or a Decimal follows from an element the empty list does not have.
type.annotate-the-position-the-call-feeds=Annotate the position the call feeds — the binding (`let total: Decimal = ...`), the field, or the declared output.
type.it-answers-a-number-and-this-position-needs-another=`{call}` answers with an Int or a Decimal, but this position needs {needed}.
type.a-newtype-is-built-from-the-result=A newtype over Int or Decimal is built from the result rather than being it (`Hours({call}(xs))`). For any other type, `{call}` does not belong in this position.

# duplicates
check.duplicate.title=DUPLICATE DEFINITION
data.a-let-is-already-defined=`let {name}` is already defined.
data.a-data-is-already-defined=data `{data}` is already defined.
data.a-data-takes-the-standard-library-qualifier=data `{data}` uses a name reserved for the standard-library qualifier `{data}` (as in `{data}.\u2026`). The qualifier is the only spelling that reaches the library, so a data of that name hides it. Pick another name.
data.a-let-and-a-data-share-one-spelling=`let {name}` and data `{name}` are one name where a value is written. A data is written as a value — a unit data is one, a newtype is applied to what it wraps, a record is constructed by its name — so the two cannot share a spelling. Rename one.
data.field-is-declared-more-than-once-in=Field `{field}` is declared more than once in `{data}`.
data.field-is-defined-more-than-once=Field `{field}` is defined more than once.
data.name-is-listed-more-than-once=`{name}` is listed more than once in {listedIn}.

# match
check.match.title=MATCH ERROR
match.the-subject-is-not-a-sum=`match` needs a sum-typed value, but got {given}.
match.not-a-case-of=`{caseName}` is not a case of {subject}.
# A brace of its own is doubled: `{{` and `}}` render as `{` and `}`, so the hint below
# reads `-> { match ... }`.
match.it-is-a-case-of-another-sum=`{caseName}` is a case of `{sum}`, so this arm belongs to a match over `{sum}`.
match.a-match-in-an-arm-takes-the-arms-after-it=A `match` written in an arm body takes every `|` after it that is indented past the arms of the match around it, which every `|` on the line it was opened on is. Put the inner match in a block (`-> {{ match ... }}`) to end it, or write this arm no further in than the outer ones.
match.matched-by-more-than-one-case=`{caseName}` is matched by more than one case.
match.an-earlier-arm-answers-for-it=this arm answers for `{caseName}` too
match.this-arm-names-one-case-twice=This arm names `{caseName}` twice, and the second says nothing the first did not.
match.an-alternative-adds-nothing-to-this-arm=`{alternative}` adds nothing to this arm: `{covering}` also answers for every value it does.
match.this-match-has-no-cases=This `match` has no cases.
match.an-option-match-takes-no-or-pattern=Or-patterns are not allowed in an Option match; use separate Some and None cases.
match.not-a-case-of-an-optional=`{caseName}` is not a case of Option; use Some or None.
match.the-case-has-no-value-to-open=`{caseName}` has no value, so it cannot be opened with `{caseName}(...)`.
match.not-a-newtype-to-open=`{name}` is not a newtype, so a match case cannot open it with `{name}(...)`.
match.bind-the-matched-value-instead=To bind the matched value itself, write `| {name} as v`.
match.the-newtype-wraps-another-type=`{name}` wraps `{wraps}`, not `{opened}`.
match.an-or-pattern-opens-nothing=An or-pattern binds the sum type, so it cannot open a case's value with `(...)`.

# tuple pattern / field access
type.a-tuple-pattern-needs-a-tuple=A tuple pattern needs a tuple, but got {given}.
type.the-pattern-binds-another-number-of-names=This pattern binds {binds} name(s), but the tuple has {holds} element(s).
declaration.cannot-read-a-field-on-this-value=I cannot read a field `{field}` on this value.
module.cannot-read-a-field-on-a-sum=I cannot read a field `{field}` on `{sum}`: a sum has no fields of its own, its cases do, and which case this is is not known until it is opened. Open it with `match` and read `{field}` in each case.
module.these-cases-have-no-such-field=These cases have no `{field}` field: {cases}.
module.every-case-declares-its-own=Every case has a `{field}` field, but each case declares its own. A sum exposes a field only when all of its cases spread the data that carries it.

# arity, block-as-value, construction
check.arity.title=WRONG NUMBER OF ARGUMENTS
declaration.applied-to-another-number-of-arguments=`{what}` takes {takes} argument(s), but got {got}.
check.block.title=BLOCK IS NOT A VALUE
name.a-block-is-not-a-value=A block is not a value: it may be passed as an argument or bound to a `let` and applied, but it cannot be returned or stored in a data.
check.construct.title=CANNOT CONSTRUCT
data.data-cannot-be-constructed=data `{data}` cannot be constructed: it needs a value of itself, with nothing to bottom out.
data.its-rules-cannot-all-hold=data `{data}` cannot be constructed: its rules cannot all hold, so no value satisfies them.
data.nothing-is-left-for-that-position-to-hold=data `{data}` cannot be constructed: the rules leave `{at}` nothing to hold.
data.no-value-its-rules-allow-is-in-that-range=data `{data}` cannot be constructed: no value the rules allow `{at}` is inside the range they leave it.
data.no-value-these-can-all-hold=data `{data}` cannot be constructed: the rules hold {at} as one value, and leave no value all of them can hold.
data.no-values-these-can-all-differ-in=data `{data}` cannot be constructed: the rules state {at} to hold different values, and leave too few values for all of them to differ.
data.these-are-held-as-one-value-and-stated-to-differ=data `{data}` cannot be constructed: the rules hold {at} as one value and state that they differ.
data.no-value-these-allow-is-in-the-range-they-share=data `{data}` cannot be constructed: the rules hold {at} as one value, and no value they allow it is inside the range they leave it.
data.no-value-its-rules-allow-is-within-the-bounds-they-require=data `{data}` cannot be constructed: no value the rules allow `{at}` is within the bounds they require it to be within.
data.no-value-these-allow-is-within-the-bounds-they-require=data `{data}` cannot be constructed: the rules hold {at} as one value, and no value they allow it is within the bounds they require it to be within.
data.a-set-cannot-be-filled-from-its-element=data `{data}` cannot be constructed: `{at}` must hold more values that differ than there are of what it holds, which is at most {available}.
data.no-size-its-rules-admit=data `{data}` cannot be constructed: the rules leave `{at}` no size it may have.
data.a-collection-that-cannot-be-empty-has-nothing-to-hold=data `{data}` cannot be constructed: `{at}` may not be empty, and there is no value of what it holds.
data.no-case-of-it-has-a-value=data `{data}` cannot be constructed: no case of it has a value.
data.it-holds-a-type-with-no-value=data `{data}` cannot be constructed: it holds `{held}`, which has no value.
data.it-would-have-one-if-the-field-could-be-absent=A value of `{data}` would exist if `{field}` could be absent, written `{field}?`.
data.it-would-have-one-if-the-collection-could-be-empty=A value of `{data}` would exist if `{at}` could be empty.
data.a-case-that-does-not-hold-it-would-give-it-one=A case that does not hold `{data}` would give it a value.
data.it-cannot-be-constructed-here=I cannot construct `{data}` here.

# a `let` implementing a `behavior` must match its contract
check.impl.title=IMPLEMENTATION MISMATCH
behavior.an-implementations-return-comes-from-the-behavior=`let {let}` implements `behavior {behavior}`, so its return type comes from the behavior — do not declare one.
behavior.the-implementation-takes-another-number-of-parameters=`let {let}` takes {takes} parameter(s), but `behavior {behavior}` has {inputs} input(s) plus {injected} injected parameter(s).
behavior.an-implementations-parameters-take-their-types-from-it=`let {let}` implements `behavior {behavior}`, so its parameters take their types from it — do not annotate `{parameter}`.
behavior.an-injected-parameter-is-out-of-order=`let {let}` parameter `{parameter}` should be `{shouldBe}`: what `depends on` names becomes the trailing parameters, in declared order.
behavior.an-ensures-clause-does-not-name-the-answer=An `ensures` clause on `{behavior}` must name `value`, the answer it constrains.
behavior.an-ensures-clause-does-not-name-a-parameter=An `ensures` clause on `{behavior}` must name at least one parameter; a relation over the answer alone belongs on its data type.
behavior.an-ensures-expression-is-not-bool=An `ensures` expression on `{behavior}` must be Bool, not {actual}.
behavior.a-behavior-with-a-clause-has-a-parameter-named-value=`{behavior}` has an `ensures` clause, so none of its parameters may be named `value`; that name denotes the answer inside the clause.
behavior.an-ensures-arm-is-not-an-output-case=`{arm}` is not an output case of behavior `{behavior}`.
behavior.an-ensures-clause-over-a-sum-names-no-arm=Behavior `{behavior}` has a sum output, so each `ensures` expression must name the output arm or arms on which `value` has a type.
behavior.an-ensures-clause-over-a-single-type-names-an-arm=Behavior `{behavior}` has one output type, so its `ensures` clause is written as an expression without an output arm.
behavior.two-ensures-clauses-share-one-name=Two `ensures` clauses on `{behavior}` are both named `{name}`; clause names are distinct within a behavior.
behavior.underscore-cannot-name-an-ensures-clause=`_` cannot name an `ensures` clause on `{behavior}`; give the clause a name or leave it unnamed.
behavior.a-composition-carries-an-ensures=Composition `{behavior}` cannot carry an `ensures` clause because a composition writes no parameter list to name.
behavior.the-ensures-reaches-a-partial-helper=The `ensures` clause on `{behavior}` must terminate, but it reaches partial helper `{partial}` ({through}).
behavior.the-ensures-constructs-a-data=The `ensures` clause on `{behavior}` constructs `{constructs}`; a clause observes its answer and constructs nothing.
behavior.the-named-ensures-constructs-a-data=The `ensures` clause `{clause}` on `{behavior}` constructs `{constructs}`; a clause observes its answer and constructs nothing.
behavior.an-ensures-answers-on-every-path=An `ensures` clause on `{behavior}` must answer Bool on every path and cannot use `unreachable`.

# helper `let` declaration rules
check.helper.title=HELPER DECLARATION
helper.a-parameter-needs-its-type=Helper `let {helper}` must annotate parameter `{parameter}` with its type.
helper.a-parameter-is-not-determined-by-the-body=Helper `let {helper}` parameter `{parameter}` is not determined by its body; annotate it with its type.
helper.this-use-names-no-type=this use does not name a type
helper.a-parameter-is-only-read-through-a-field=Helper `let {helper}` parameter `{parameter}` is only read through a field, which names no type; annotate it with its type.
helper.a-field-is-read-off-it-and-that-names-no-type=a field is read off it, and that names no type
helper.a-function-typed-parameter-needs-its-type=Helper `let {helper}` parameter `{parameter}` is used as a function; a function-typed parameter must be annotated with its type.
helper.the-body-is-not-what-the-helper-declares=Helper `let {helper}` declares it returns {declared}, but its body is {body}.
helper.what-is-written-here-is-not-what-its-position-takes=This position takes {takes}, but what is written here is {written}.
name.a-recursive-helper-must-declare-its-return-type=Recursive helper `let {helper}` must declare its return type (`let {helper} (...) : <type> = ...`), because its result cannot be inferred through the recursion.
name.a-recursive-helper-is-pure=Recursive helper `let {helper}` is pure and cannot call the injected behavior `{injected}` — put the effect in the behavior that calls this helper.
check.invariant.invalid.title=INVALID INVARIANT
invariant.the-invariant-reaches-a-partial-helper=The invariant of `{data}` reaches the `partial` helper `{partial}` ({through}), which carries no termination guarantee; an invariant is checked at construction time and must terminate.
invariant.the-invariant-constructs-a-data=The invariant of `{data}` constructs `{constructs}`, but an invariant may not construct a data — it observes the value being built, it does not build another.
invariant.the-named-clause-constructs-a-data=The invariant `{clause}` of `{data}` constructs `{constructs}`, but an invariant may not construct a data — it observes the value being built, it does not build another.
invariant.the-clause-reaches-that-construction=The invariant `{clause}` reaches that construction.
invariant.this-clause-reaches-that-construction=This invariant reaches that construction.
invariant.a-sum-is-never-constructed=`{data}` is a sum, and nothing constructs one — a value of `{data}` is written as one of its cases — so this invariant would be owed by no construction and checked at no boundary.
invariant.write-it-on-a-case-or-on-a-newtype-over-the-sum=Write the rule on the case it is about, or on a newtype over `{data}`, which is built and carries its own check.
invariant.a-unit-data-has-nothing-to-observe=`{data}` is a unit data, so it has no field for this invariant to observe and nothing it could reject. Drop the clause, or give `{data}` the field the constraint is about.
invariant.underscore-cannot-name-a-clause=`_` cannot name an invariant clause of `{data}`. An attempt writes `| _ -> ...` for the clauses that carry no name, so a clause named `_` could never be answered by name.
invariant.name-the-clause-or-leave-it-unnamed=Give the clause a name of its own, or leave it unnamed — an unnamed clause is enforced and answered by `| _ -> ...`.
invariant.an-invariant-answers-on-every-path=The invariant of `{data}` answers `unreachable`, but an invariant says whether the value being built holds, on every path through it. A path that cannot arise is a rule about the values the model makes, not about this one.
invariant.two-clauses-share-one-name=`{data}` declares two invariant clauses named `{clause}`. A name is what an attempted construction and a boundary issue call one rule, so two rules cannot share it.
check.data.invalid.title=INVALID DATA
data.a-data-with-an-empty-body=data `{data}` has an empty body, which names a type with one value — that is a unit data, and it is written without a body.
data.write-it-as-a-unit-data-or-give-it-fields=Write `data {data}` and build it by name, or give `{data}` the fields it holds.

# module / exposing
check.module.title=MODULE ERROR
module.exposing-is-type-granular=`exposing` is type-granular: a data's `decoder`/`encoder` are always public once the data is exposed. Write `{write}`, not `{notThis}`.
module.exposing-names-an-imported-name=`exposing` names `{name}`, which is imported into this module, not defined here; `exposing` lists a module's own definitions and does not re-export imported names.
module.exposing-names-something-this-module-does-not-declare=`exposing` names `{name}`, which is not a data or behavior of this module.
declaration.it-rests-on-a-behavior-nobody-has-written=`{behavior}` is built here and rests on `{rested}`, which declares what it depends on and has no `let`, so Souther is the one to implement it and nobody has.
declaration.write-its-let-or-leave-this-one-unwritten-too=Write `let {rested}`, or take the `let` off `{behavior}` as well so that both wait together.

# a type that must not cross the decoder/encoder boundary
check.boundary.title=BOUNDARY TYPE
type.a-parameter-is-an-anonymous-union=parameter `{parameter}` has an anonymous union type `{type}`; a behavior's parameter must name a single type — declare `data ... = {type}` and take that name.
type.a-function-has-no-value-to-compare=A function has no value to compare, so {given} cannot be an operand of `==` or `/=`.
type.a-set-element-is-compared-and-a-function-is-not=A Set has no duplicate elements, which asks whether two are equal, and a function has no value to compare: {given}.
type.a-map-key-is-compared-and-a-function-is-not=A Map finds a value by its key, which asks whether two keys are equal, and a function has no value to compare: {given}.
type.a-parameter-carries-a-function=Parameter `{parameter}` carries a function ({type}); a function has no external representation, so it cannot cross the boundary into a behavior.
type.an-output-carries-a-function=`{behavior}` outputs a function ({type}); a function has no external representation, so it cannot cross the boundary out of a behavior.
type.an-output-carries-an-optional=The output of `{behavior}` carries an optional ({type}).
type.a-parameter-carries-an-optional=Parameter `{parameter}` carries an optional ({type}).
type.a-model-type-owns-the-absence=A model type has to own the absence where the optional stands: put it on a `?` field of a data, or name it as a case of a sum. Where the whole output is the optional, that sum is written directly — `-> A | Missing`.
type.a-parameter-takes-a-type-the-language-declares=Parameter `{parameter}` takes `{type}`, which the language declares rather than this model.
type.an-output-is-a-type-the-language-declares=`{behavior}` answers `{type}`, which the language declares rather than this model.
type.a-field-takes-a-type-the-language-declares=`{field}` is written from `{type}`, which the language declares rather than this model.
type.declare-it-as-a-type-of-the-model=Declare this as a type of the model and write that where it crosses — a case a behavior answers, a data it takes, or the type a field is written from — so what the model publishes stays its own.
type.a-parameter-is-a-tuple=parameter `{parameter}` is a tuple; a tuple has no external representation and cannot cross the boundary, so a behavior's input must be a named data.
type.an-output-is-a-tuple=behavior `{behavior}` outputs a tuple; a tuple cannot cross the boundary, so a behavior's output must be a named data or a sum of them.

# missing type argument on a collection type
check.typearg.title=MISSING TYPE ARGUMENT
type.a-list-needs-its-element-type=`List` needs a type argument, e.g. `List<Int>`.
type.a-set-needs-its-element-type=`Set` needs a type argument, e.g. `Set<String>`.
type.an-option-needs-its-type-argument=`Option` needs a type argument.
type.a-map-needs-its-value-type=`Map` needs a value type, e.g. `Map<String, Int>`.
type.a-fields-map-cannot-be-keyed-by-that=`{field}` crosses the boundary, so the Map it holds cannot be keyed by {key}.
type.a-parameter-map-cannot-be-keyed-by-that=Parameter `{parameter}` carries a Map keyed by {key}, which cannot cross the boundary.
type.an-output-map-cannot-be-keyed-by-that=`{behavior}` outputs a Map keyed by {key}, which cannot cross the boundary.
type.a-map-is-a-json-object-keyed-by-strings=A Map is a JSON object, whose keys are strings, so a Map that crosses needs a key that renders as and parses from a bare string. Inside a behavior body a Map may be keyed by any value.

# comparison / arithmetic operands
type.comparison-needs-ordered-values-of-one-type=The two operands of a comparison must be ordered values of the same type (Int, String, Decimal, Date, Time, DateTime, Instant, a newtype over one of these, or one enumeration — two cases order against each other only when one sum lists them both), but got {one} and {other}.
arithmetic.an-operand-is-not-a-number=An arithmetic operand must be Int or Decimal, but got {operand}.
arithmetic.two-different-newtypes={left} and {right} are different newtypes, so arithmetic does not combine them.
arithmetic.convert-one-to-the-others-newtype=If both measure the same thing, convert one to the other's newtype and combine those. If they do not, there is nothing to combine.
arithmetic.a-product-changes-dimension=A product of {left} and {right} is a quantity in neither of them, and the dimension it would be in is not one this language models.
arithmetic.compute-on-value-and-build-the-product=Compute on `.value` and build the newtype the product belongs to.
arithmetic.a-quotient-changes-dimension=A quotient of {left} and {right} is a value in neither of them, and the dimension it would be in is not one this language models.
arithmetic.compute-on-value-and-build-the-quotient=Compute on `.value`, and build a newtype from the result if the quotient is one.
arithmetic.a-reciprocal-changes-dimension=Dividing {value} by {newtype} inverts it, and the dimension that leaves is not one this language models.
arithmetic.compute-on-value-and-build-the-reciprocal=Compute on `.value`, and build a newtype from the result if it is one.
arithmetic.only-a-literal-is-read-as-the-newtype=Only a literal is read as {newtype} beside it, and this {value} is not written out.
arithmetic.build-it-where-the-value-comes-from=Build {newtype} where the value comes from, or compute on `.value`.
arithmetic.a-value-of-another-base={newtype} wraps {base}, and this {value} is not one.
arithmetic.what-each-operator-takes-beside-a-newtype=`*` scales by {base} on either side; `/` scales only as {newtype} / {base}, and {base} / {newtype} is a reciprocal. `+` and `-` read {base} only where it is written out as a literal. Otherwise build {newtype}, or compute on `.value`.
arithmetic.a-newtype-with-no-direct-numeric-base=Arithmetic reaches a newtype whose value is directly Int or Decimal, and {newtype} wraps {wrapped}.
arithmetic.reach-the-base-with-value=Arithmetic does not open {newtype} on its own. Write `.value` to reach {wrapped}, and the rules of {wrapped} apply from there.

# sum definition and derived decoder/encoder (codec)
check.sum.title=SUM DEFINITION
check.codec.title=CODEC
behavior.unknown-case-in-a-sum=Unknown case `{caseName}` in sum `{sum}`.
behavior.a-case-is-declared-in-another-module=`{caseName}` is declared in `{module}`, so it cannot be a case of `{sum}`.
behavior.a-sums-cases-are-declared-with-it=A sum's cases are declared with it: the generated sum is a sealed interface, and only its own module can implement it. Consume `{caseName}` at the boundary, or re-express it as a case of this module.
behavior.a-sum-contains-itself=Sum `{sum}` contains itself through {through}. A sum's cases are the values it can be, so one of them cannot be the sum itself.
behavior.a-built-in-option-case-cannot-be-declared=`{name}` is a built-in Option case and cannot be declared as a data type.
data.spread-is-not-a-product-data=Cannot spread `...{spread}` — it is not a product data.
codec.an-iso-text-encoder-takes-a-temporal-value=An ISO text encoder expects a Date or DateTime, but got {given}.
codec.an-optional-encoder-takes-an-optional=An optional encoder expects an Option, but got {given}.
codec.a-list-encoder-takes-a-list=A `list(...)` encoder source must be a List, but got {given}.
codec.a-set-encoder-takes-a-set=A set encoder source must be a Set, but got {given}.
codec.a-map-encoder-takes-a-map=A map encoder source must be a Map, but got {given}.
codec.the-decoder-builds-another-type=The decoder for `{data}` must construct `{data}`, but constructs `{builds}`.
data.not-a-field-of=`{field}` is not a field of `{data}`.
data.a-field-expects-another-type=Field `{field}` expects {expects}, but got {got}.
data.spread-is-not-a-data-value=A spread `..{spread}` must be a data value, or a sum every case of which spreads the same data.
data.name-the-union-with-a-declaration=`{union}` is a union written where it stands, so nothing declares what its cases share. Name the union with a `data` declaration, and the part every case spreads may be spread from it.
data.spread-of-a-sum-whose-cases-share-nothing=A spread `..{spread}` copies the fields the cases of `{sum}` share, and they share none: no data is spread by every case. Open `{spread}` with `match` and spread the case.

# pipeline / reserved names / numeric
check.pipe.title=PIPELINE
behavior.a-stage-after-the-first-takes-one-input=`{stage}` takes {takes} inputs, so it cannot follow `>->` in `{pipeline}`. Every stage after the first takes one input: call it inline, or open the branches with `match`. Only the first stage may take several.
behavior.a-boundary-edge-is-not-a-stage=decode/encode are boundary edges, not pipeline stages; `>->` composes behaviors only.
behavior.a-pipeline-composes-with-itself=Pipeline `{pipeline}` composes with itself (a cycle).
check.reserved.title=RESERVED NAME
name.a-binding-may-not-shadow-a-built-in=`{name}` is a built-in value and cannot be used as a binding name — it would shadow the built-in; choose another name.
type.the-pattern-must-be-written-out=The pattern of `String.matches` must evaluate to a string at compile time, so it can be validated there: write a string literal, or join literals and values named by a top-level `let` with `++`.
type.the-pattern-is-not-a-regular-expression=`String.matches` pattern is not a valid regular expression: {why}
type.not-a-union-member=`{member}` cannot be a union member: a member is a type a `match` arm can name — one of the primitives, or a data type declared here or imported.
type.one-name-for-two-members=`{name}` is written for two types in one union: the one `{one}` declares and the one `{other}` declares.
type.a-member-is-named-by-its-written-name=A match arm names a member by its written name, and so does the `"type"` discriminator of the external representation, so one name cannot stand for two members. Re-express one of them as a type of this module.
data.a-case-declares-the-discriminator-field=`{caseName}` is a case of `{sum}` and declares a field `{field}`, which is the discriminator its sum writes beside the fields.
data.a-member-declares-the-discriminator-field=`{member}` is a member of the output of `{behavior}` and declares a field `{field}`, which is the discriminator that union writes beside the fields.
data.the-tag-and-the-field-want-one-key=The tag and the field want the one key `{field}`, and whichever is written second is the only one left. Rename the field.
module.a-member-reaches-the-union-through-a-data=The output of `{data}` has the member `{member}`, which is not a type this module declares, so it joins the union through a generated case class `{through}` — and `data {caseClass}` already takes that name.
module.a-member-reaches-the-union-through-a-behavior=The output of `{behavior}` has the member `{member}`, which is not a type this module declares, so it joins the union through a generated case class `{through}` — and `behavior {caseClass}` already capitalizes into that name.
module.rename-the-member-or-the-type-it-collides-with=A member this module did not declare reaches the union through `{member}`, its own name with `Case` after it. Rename what holds that name here.
module.two-members-join-through-one-case-class=`{one}` and `{other}` are both members of a union of this module, and both join through a generated case class `{caseClass}`.
module.a-member-goes-by-its-own-name-with-case-after-it=A member goes by its own name with `Case` after it, so two types of one spelling cannot both be members here, even in different behaviors. Re-express one of them as a type of this module.

# first-class functions and function-typed helper parameters
check.fn.title=FUNCTION
helper.the-block-takes-another-number-of-arguments=The block passed to `{parameter}` of `let {helper}` takes {takes} argument(s), but is written with {written}.
helper.the-block-answers-another-type=The block passed to `{parameter}` of `let {helper}` must return {must}, but returns {returns}.
helper.a-value-where-a-function-is-taken=`{parameter}` of `let {helper}` expects a function, but `{written}` is a value, not a function.
helper.the-function-goes-to-another-argument=Argument {at} of `{call}` is `{parameter}`, which does not take a function. The function goes to argument {functionAt} (`{functionParameter}`).
helper.write-the-call-this-way=Write `{call}({shape})`.
helper.this-argument-takes-a-function=Argument {at} of `{call}` is `{parameter}`, which takes a function: pass a named function or a lambda.
helper.this-argument-takes-no-function=Argument {at} of `{call}` is `{parameter}`, which does not take a function: a lambda or a field getter cannot be written here.
helper.the-function-takes-another-number-of-arguments=`{call}` calls its function with {called} argument(s), but the function takes {takes}.
helper.the-function-takes-another-type=`{call}`'s element type {given} is not acceptable to the function, which takes {takes}.
helper.the-step-answers-another-type-than-the-accumulator=`{call}`'s step answers {answers}, and the accumulator it builds holds {accumulator}.
helper.this-expects-a-block=`{call}` expects a block, e.g. `{call}((acc, x) -> ..., seed, xs)`.
helper.the-block-is-written-with-another-number-of-parameters=This block takes {takes} parameter(s), but got {written}.
helper.the-functions-type-cannot-be-read=Cannot infer the type of the function `{name}`: write its type (`let {name}: (Int) -> Bool = ...`), or apply it in this scope so its parameter types can be read off the application. An application inside a lambda is in that lambda's scope, not this one, and says nothing here.
helper.the-function-is-applied-at-two-types=The function `{name}` is applied with different argument types: {one} vs {other}.
helper.the-lambda-is-applied-with-another-number-of-arguments=This lambda takes {takes} parameter(s), but is applied with {applied}.
helper.the-branches-answer-different-function-types=The two branches produce different function types: {one} vs {other}.

# remaining
behavior.a-composition-is-already-its-own-implementation=`let {name}` cannot implement the composition `behavior {name}`, which is already its own implementation.
behavior.the-body-is-not-what-the-behavior-returns=behavior `{behavior}` returns {returns}, but its `let` body is {body}.
data.a-tuple-cannot-be-a-field=A tuple cannot be a data field (`{data}.{field}`): a tuple has no external representation, so it cannot cross a decoder/encoder boundary. Use a named data.
data.a-field-takes-a-method-of-object=`{field}` cannot be a field of `{data}`: the generated class reads its fields through accessors of the same name, and `{field}()` is already a method every JVM value has. Choose another name.
data.spread-supplies-the-wrong-type=The spread provides `{field}` as {supplied}, but `{type}` needs {needed}.
codec.the-element-encoder-is-not-for-the-element-type=The element encoder {encoder} does not match the element type {elementType}.
match.the-branches-disagree=The match branches disagree: {one} vs {other}.
name.not-a-standard-library-function=`{name}` is not a standard-library function.
type.it-expected-one-type-and-got-another={what}: expected {expected}, but got {got}.

# module linking, imports, and constant invariants
data.the-written-value-violates-the-invariant=`{value}` violates its invariant.
data.the-written-value-violates-the-clause=`{value}` violates the invariant clause `{clause}`.
module.the-module-is-in-the-reserved-namespace=module `{module}` is in the reserved `souther` namespace: the compiler ships souther.string / souther.list / souther.map / souther.bool, and a user module cannot take a reserved name.
module.the-module-takes-the-standard-library-qualifier=module `{module}` uses a name reserved for the standard-library qualifier `{module}` (as in `{module}. …` / `import {module} ( … )`); pick another module name.
module.duplicate-module=Duplicate module `{module}`.
module.a-module-it-needs-is-not-on-the-path=Module `{module}` needs `{needed}`, which is not on the path either.
module.add-it-to-this-projects-dependencies=`{module}` is a dependency of a module you depend on. Add it to this project's dependencies.
module.it-is-reached-from-here-too=This import reaches it too.
module.the-module-is-compiled-here-and-on-the-path=Module `{module}` is compiled here and is also on the path.
module.rename-it-or-drop-the-dependency=One name cannot stand for two modules. Rename this one, or drop the dependency that also provides `{module}`.
module.the-module-cannot-be-read-back=Module `{module}` is on the class path, and this compiler cannot read what it published.
module.it-was-built-by=It was built by Souther {by}, which does not agree with this compiler about what an importing module may reach.
module.a-class-it-says-it-declares-is-not-on-the-path=It says it declares `{declaration}`, and the class carrying that declaration is not on the class path.
module.its-metadata-cannot-be-read-here=One of its classes carries metadata this compiler cannot read.
module.it-declares-another-module=What it carries declares `{named}`, not the module it was found under.
module.what-it-published-is-not-source-this-compiler-parses=What it published is not source this compiler parses.
module.an-import-line-of-its-cannot-be-read-here=Its `import {from}` is not a line this compiler can read.
module.a-name-it-published-reaches-nothing-here=A name its declarations write reaches nothing this compiler can see here.
module.a-declaration-of-its-cannot-be-read-here=Its `{declaration}` is not a declaration this compiler can read there.
module.rebuild-it-or-compile-against-what-built-it=Rebuild `{module}` with this compiler, or compile against the version that built it.
module.unknown-module=Unknown module `{module}`.
module.the-module-does-not-expose-it=`{name}` is not exposed by `{module}`.
module.the-module-declares-no-such-name=`{name}` is not defined in `{module}`.
invariant.nothing-known-here-establishes=Constructing `{data}` here may violate `{unsettled}`: nothing known here establishes it.
invariant.nothing-known-here-establishes-but-does-establish=Constructing `{data}` here may violate `{unsettled}`: nothing known here establishes it. Established here: {settled}.
invariant.nothing-known-here-establishes-the-invariant=Constructing `{data}` here may violate its invariant: nothing known here establishes it.
invariant.nothing-known-here-establishes-the-invariant-but-does-establish=Constructing `{data}` here may violate its invariant: nothing known here establishes it. Established here: {settled}.
invariant.guard-it-or-let-a-data-own-the-relation=If inputs for which the construction fails are ones the behavior accepts, that failure is a business case: guard the construction, or attempt it with `... as name else ...`, which states the invariant check once. If those inputs are not admitted by the model, the relation belongs to a data — declare it as an `invariant` on the input that holds these values, introducing such a data where none exists.
invariant.this-clause-is-not-established-here=Nothing known here establishes this clause.
invariant.this-clause-rejects-this-value=The value being built is one this clause rejects.
invariant.this-clause-rejects-the-value-on-some-of-the-paths-here=On some of the paths that reach this construction, the value being built is one this clause rejects; on others another clause rejects it.
invariant.the-value-is-one-the-invariant-rejects=Constructing `{data}` here violates `{unsettled}`: the value being built is one that clause rejects. Fix the value.
invariant.the-value-is-one-the-invariant-rejects-unnamed=Constructing `{data}` here violates its invariant: the value being built is one the invariant rejects. Fix the value.
invariant.the-value-is-rejected-on-a-reachable-path=Constructing `{data}` here violates `{unsettled}` on a reachable path: under what is assumed where it stands, the value being built is one that clause rejects. Fix the value, or guard the path so the violating case cannot reach here.
invariant.the-value-is-rejected-on-a-reachable-path-unnamed=Constructing `{data}` here violates its invariant on a reachable path: under what is assumed where it stands, the value being built is one the invariant rejects. Fix the value, or guard the path so the violating case cannot reach here.
import.imported-name-collides-with-a-declaration=Imported `{name}` conflicts with a definition of the same name in this module.
import.rename-or-qualify-the-colliding-name=One name cannot stand for two things. Rename the local definition, drop the import and name the imported one through its module, or drop the local definition and use the imported one.
module.the-name-is-imported-from-two-modules=`{name}` is imported from both `{one}` and `{other}`.
module.it-was-already-imported-here=`{name}` was already imported from `{from}` here.
module.import-at-most-one-and-qualify-the-other=One name cannot stand for two types. Import at most one of them, and name the other through its module (`{module}.{name}`) or through an `import ... as` alias.
module.the-same-name-is-imported-twice-from-one-module=The same name is imported twice from the same module. Drop the second import.
import.name-is-not-a-standard-library-function=`{name}` is not a function in the standard-library module `{module}`.
injection.an-injected-input-rests-on-what-is-kept=`behavior {behavior}` has no `let`, so it is implemented outside this module, and its input `{kept}` is not in `exposing`.
injection.an-injected-output-rests-on-what-is-kept=`behavior {behavior}` has no `let`, so it is implemented outside this module, and its output `{kept}` is not in `exposing`.
injection.the-base-class-is-public-whatever-exposing-says=The base class an implementation extends is public whatever `exposing` says, and the implementation writes this type where it overrides `apply`. Add `{kept}` to `exposing`.
module.an-exposed-field-rests-on-what-is-kept=`{exposed}` is exposed, and its field `{field}` is a `{type}`, which is not.
module.an-exposed-input-rests-on-what-is-kept=`{exposed}` is exposed, and its input `{input}` is not.
module.an-exposed-output-rests-on-what-is-kept=`{exposed}` is exposed, and its output `{output}` is not.
module.what-reaches-out-may-not-rest-on-what-is-kept=What a module reaches out with may not rest on what it keeps to itself: a reader has no name for `{kept}`, and the class carrying it is not one it may touch. Add `{kept}` to `exposing`, or take `{exposed}` out of it.
module.the-alias-is-already-taken=The alias `{alias}` is already how `{by}` is named here.
module.an-alias-is-a-name-nothing-else-answers-to=An alias renames a module for this module only, so it has to be a name nothing else answers to. Pick another one.
check.import.title=IMPORT
module.imported-but-never-used-under-this-name=`{name}` is imported but never used under this name.
module.take-it-off-the-import-list=Take it off the import list. What another module declares is reachable qualified whether or not it is imported, so an entry here earns its place only by being written bare somewhere below.
module.no-module-of-that-name=`{module}` names no module, so `{module}.{name}` refers to nothing.
module.it-is-declared-there-and-not-exposed=`{name}` is declared in `{module}` but not exposed by it.
module.the-module-declares-no-such-qualified-name=`{module}` declares no `{name}`.
type.a-temporal-takes-a-written-string=`{type}(...)` takes a written string, e.g. `Date("2026-07-01")` / `Time("09:00")` / `DateTime("2026-07-01T09:00")` / `Instant("2026-07-01T09:00:00Z")`. To build one from parts a model holds, use `Date.fromParts` / `Time.fromParts`.
type.that-is-not-a-temporal-of-that-kind=`{written}` is not a {type}. Write `Date("2026-07-01")` / `Time("09:00")` / `DateTime("2026-07-01T09:00")` / `Instant("2026-07-01T09:00:00Z")`.
type.an-instant-is-written-in-utc=`{written}` carries an offset. It names the same moment `Instant("2026-07-01T00:30:45Z")` names, and that is how an `Instant` is written: a written value is written the way the value is written back. A boundary reads either.
type.a-leap-second-is-not-a-moment=`{written}` names a leap second. The language has no moment for one, and reading it as the second before would answer a different moment than the text says.
type.a-time-of-day-is-written-to-the-second=`{written}` is finer than a second, and a `{type}` holds no fraction of one. Write it to the second, or use `Instant` where the sub-second reading is the point.
data.a-newtype-wraps-one-value=`{newtype}` wraps one value, but is applied to {applied} argument(s).
helper.called-with-another-number-of-arguments=Helper `let {helper}` takes {takes} argument(s), but is called with {called}.
helper.an-annotation-on-a-function-binding-is-not-a-function-type=The binding `{binding}` holds a function, and its annotation is not a function type.
helper.write-a-function-type-or-leave-the-annotation-off=Write a function type, such as `(Int) -> Bool`, or leave the annotation off and let the applications settle it.
behavior.a-behavior-capitalizes-onto-a-data=behavior `{behavior}`'s first letter is capitalized to form the JVM class `{jvmClass}` (spec jvm-behavior), which collides with data `{jvmClass}`; rename one so their class names differ.
behavior.two-behaviors-capitalize-to-one-class=behaviors `{one}` and `{other}` both capitalize to the same JVM class `{jvmClass}` (spec jvm-behavior); rename one so their class names differ.
behavior.a-union-outputs-interface-collides-with-a-data=The output of `{behavior}` is a union, so it is generated as a sealed interface `{jvmClass}` (spec jvm-anonymous-union) — and `data {jvmClass}` already takes that class name.
behavior.a-union-outputs-interface-collides-with-a-behavior=The output of `{behavior}` is a union, so it is generated as a sealed interface `{jvmClass}` (spec jvm-anonymous-union) — and `behavior {other}` already capitalizes into that class name.
behavior.a-union-output-reaches-java-through-that-name=A behavior with a union output reaches Java through `{jvmClass}`, its own capitalized name with `Result` after it. Rename what holds that name here.
data.a-tuple-has-no-external-representation=`{data}` carries {carries}: a tuple has no external representation, so no codec can be derived. Use a named data.
data.no-codec-can-be-derived=No codec can be derived for `{data}`: it carries {carries}, which has no external representation.
data.a-newtype-may-not-wrap-an-optional=`{newtype}` wraps `{wraps}?`, but a newtype wraps one value and takes its representation, so there is nothing for it to be when the value is absent.
data.wrap-the-value-and-write-the-question-mark-on-the-field=Wrap the value itself (`data {newtype} = ...`) and write the `?` where it is used, on the field.

# --- opening a value in a binding pattern (outside `match`) ---
check.open.title=CANNOT OPEN
type.not-a-newtype-to-open-in-a-binding=`{name}` is not a newtype, so a binding cannot open it with `{name}(...)`.
type.a-binding-opens-only-what-every-value-has=A binding has one arm, so it opens only what every value of the type has: a newtype's wrapped value, a tuple's elements, a record's fields. A value that may or may not have a shape is opened with `match`.
type.the-pattern-opens-another-type=This pattern opens `{opens}`, but the value is `{value}`.

# --- syntax errors (lexer / parser) ---
parse.title=SYNTAX ERROR
parse.a-declaration-expected-something-else=I expected {expected} here, but found {found}.
parse.an-expression-expected-something-else=I expected {expected} here, but found {found}.
parse.a-pattern-expected-something-else=I expected {expected} here, but found {found}.
parse.an-example-expected-something-else=I expected {expected} here, but found {found}.
parse.an-expression-was-expected=I expected an expression here.
parse.a-literal-was-expected=I expected a literal here.
parse.a-statement-was-expected=I expected a line of a block here.
parse.a-pattern-was-expected=I expected a pattern here.
parse.a-source-file-starts-with-a-module-declaration=A source file starts with a `module` declaration (or omit it in a single file).
parse.a-source-is-named-after-something-that-is-not-a-name=This source has no `module` header, so it is named after `{given}`, which is not a name a module may have. Write a `module` header, or name the file so that its stem is a name.
parse.a-top-level-definition-starts-with-a-keyword=A top-level definition starts with `data`, `behavior`, or `let`.
parse.a-behavior-is-written-with-a-colon-or-an-equals=A behavior is written with `:` before its parameters (a signature) or `=` (a composition).
parse.intrinsic-is-a-core-privilege=`intrinsic` is a core privilege: only a module in the reserved `souther` namespace declares one.
parse.private-is-a-core-privilege=`private` is a core privilege: only a module in the reserved `souther` namespace declares one.
parse.a-type-variable-is-only-allowed-in-the-core=A type variable `{variable}` is only allowed in the core (the reserved `souther` namespace); a user model stays bounded.
parse.an-optional-is-only-written-on-a-field-or-in-the-core=An optional type `T?` may be written on a data field, or in the core (the reserved `souther` namespace); a user model never names an optional elsewhere.
parse.leave-the-type-off-and-the-optional-is-inferred=On the result of a helper, leave the type off and the optional is inferred. Where the model owns the absence, answer a list of nought or one and use `List.flatMap`.
parse.a-question-mark-follows-a-sum-of-cases=`?` marks a single type optional, but it follows a sum of {cases} cases.
parse.unreachable-states-its-reason-as-a-string=`unreachable` states why the point cannot be reached, as a string: `unreachable "twenty insured years cannot precede the age of thirty"`.
parse.a-block-ends-in-one-expression=A block ends in one expression, which is its value; this one has only `let`/`guard` lines. Layout does not end a statement, so a result on its own line may continue the line above.
parse.options-wrapped-value-is-bound-positionally=Option's wrapped value is bound positionally: write `| Some v`, not `| Some as v`.
parse.some-parens-open-a-wrapped-newtype=Write `| Some v` to bind the whole value. `Some(...)` opens a wrapped newtype, as in `| Some({newtype} v)`.
parse.a-case-value-is-bound-with-as=A case value is bound with `as`: write `| {caseName} as {bound}`, not `| {caseName} {bound}`. Only `Some` carries a payload to bind positionally.
parse.a-records-fields-are-destructured-directly=A record's fields are destructured directly: write `| Some {{ field }}`, not `| Some(Type {{ field }})`. The parens open a newtype.
parse.a-newtype-cannot-wrap-a-tuple=A newtype takes the external representation of what it wraps, and a tuple has none. Wrap a named data instead.
parse.a-newtype-cannot-wrap-a-function=A newtype takes the external representation of what it wraps, and a function has none.
parse.a-sums-cases-are-declared-named-data=A sum's cases are references to declared named data, so a case is never a generic type. Declare a data for it and name that.
parse.a-field-type-is-not-an-anonymous-union=Field `{field}` is written with an anonymous union, which is not a form a field's type is written in. Declare a `data` over the cases and give the field that name.
parse.an-anonymous-union-is-not-written-inside-another-type=An anonymous union is not written inside another type. Declare a `data` over the cases and name that here.
parse.an-optional-is-not-written-inside-another-type=`?` marks a data field's own optional and is not written inside another type. Write `Option<T>` for the type, or put the `?` on the field that holds it.
parse.an-example-only-file-starts-with-its-module=An example-only file starts with the module its examples belong to: `examples for <module>`.
parse.a-dependency-clause-is-two-words=A behavior's dependency clause is two words: `depends on <name>`.
parse.a-let-with-no-parameters-is-written-without-parens=`let {name}` takes no parameters, so it is written without `()`: a `let` with a parameter list defines a function, and one without defines a value.
parse.an-example-needs-at-least-one-row=An `example` needs at least one `|` row.
parse.a-fake-needs-at-least-one-row=A `fake` needs at least one `|` row.
parse.a-row-name-says-nothing=This row's name names nothing. Write a name, or write the row without one.
parse.a-type-variable-needs-a-name-after-the-apostrophe=A type variable needs a name after `'`, e.g. `'a`.
parse.a-fractional-literal-needs-the-m-suffix=A fractional literal is a Decimal and needs the `m` suffix (write `{literal}m`); Souther has no floating-point type.
parse.a-string-literal-is-not-closed=This string literal is not closed before the end of the line.
parse.an-escape-is-not-one-the-language-reads=`\\{escaped}` is not an escape this language reads. The escapes are `\\n`, `\\t`, `\\r`, `\\"` and `\\\\`; a backslash of its own is written `\\\\`.
parse.an-unexpected-character=Unexpected character `{character}`.
parse.a-name-does-not-begin-with-an-underscore=`{written}` begins with `_`, which carries a name on but begins none: `foo_bar` is a name, `_foo` is not. On its own `_` is the discard.
parse.a-dollar-is-not-written-in-a-name=`$` is not written in a name: it is how the compiler spells the names it generates beside yours.
tok.name=a name
tok.integer=an integer
tok.decimal=a decimal
tok.string=a string
tok.typevar=a type variable
tok.eof=the end of input

# The construct a fork was written as, and what one way through it is, dropped into the sentences
# above. Words and not rules: which of them a sentence takes is decided by what the source wrote,
# and the sentence itself is one wording. Localized here because the walk that found the construct
# has no reader and so no language to name it in.
construct.if=the `if`
construct.guard=the `guard`
construct.comprehension=the comprehension
construct.comparison=the comparison
construct.fork=the fork
construct.predicate=the predicate
arm.then=the `then` arm
arm.else=the `else` arm
arm.continued=the body past the guard
arm.kept=the element the comprehension keeps
arm.dropped=the empty list the comprehension yields
arm.case=the `case {0}` arm
arm.constructed=the arm the value is built in
arm.departure=the `else` arm
arm.departure.clause=the `else {0}` arm
declaration.the-right-side-of-a-value-pipe-is-a-call=The right side of `|>` must be a function call or a function name.
declaration.it-nests-deeper-than-is-read=This nests deeper than I read. Break it into parts that have names, so each one is read on its own and says what it is: a binding for a value, a declaration for a type. What those parts add up to is bounded too, and far above this.

# --- examples (E1901-E1920) ---
check.example.title=EXAMPLE
example.no-behavior-of-that-name=`{target}` is not a behavior in this module, so this example has no target.
example.the-target-cannot-be-evaluated=`{target}` cannot be evaluated as an example.
example.what-an-example-runs=An example runs a behavior with a `let` body, or a `>->` composition of them; here {here}.
example.the-row-hands-over-another-number-of-inputs=`{target}` takes {takes} input(s), but this example row has {given}.
example.an-input-could-not-be-built=Input #{at} of `{target}` could not be built: {why}
example.the-expected-value-could-not-be-built=The expected value of `{target}` could not be built: {why}
example.not-one-of-the-result-cases=`{expected}` is not one of the result cases of `{target}`.
example.the-result-cases-are=Expected one of: {cases}
example.the-row-does-not-hold=This example does not hold.
example.the-two-are-of-different-types=At {at} the row states {expected}, but the behavior answered with {actual}.
example.what-the-row-said={said}
example.an-examples-file-holds-only-examples=An `examples for` file holds examples, the fakes they run against and the values they name. A data, a behavior, an import, and a `let` with parameters belong in the module itself.
example.the-name-is-already-declared=`{name}` is already declared by `{module}`, so the rows here would read that one. Rename this value, or drop it and name the one the module declares.
example.the-model-names-a-value-an-attached-file-declares=`{name}` is declared in an attached `examples for` file, which holds the rows, the fakes they run against and the values those rows name. A declaration of the model cannot name one: the module would not compile without that file, and a clause carrying the name travels to an importer that has no source for it.
example.move-the-value-into-the-module-itself=Declare `{name}` in the module's own source, or write what it stands for where it is needed.
example.the-module-is-not-being-compiled=`examples for {module}` names a module that is not being compiled.
example.the-name-is-on-more-than-one-row=`{name}` names more than one row of `{target}`, so nothing outside this file can say which row it means.
example.the-row-reached-an-unreachable-point=This row reached a point the model declares cannot arise: {reason}
example.either-the-row-or-the-reason-is-wrong=Either the row states a combination the model rules out, or the reason written at that `unreachable` does not hold.
example.no-row-expects-that-case=No row expects `{caseName}`, so nothing says `{behavior}` owes that answer.
example.write-a-row-expecting-that-case=Write a row whose expected value is a `{caseName}`, or drop the case from the signature.
example.no-row-applies-it-to-that-case=No row applies `{behavior}` to a `{caseName}`, so input #{at} has a case nothing was tried with.
example.no-row-is-at-the-point-of-the-border-a-rule-drew=No row is at the {point} point {at} = {value} of the border {rule} draws.
example.no-row-is-at-the-point-of-the-line-a-rule-drew=No row is at the {point} point of the line {rule} draws.
example.no-row-is-at-the-point-of-the-line-a-construct-drew=No row is at the {point} point of the line {construct} draws.
example.the-line-as-read-at=Read at {at}, a row there is {asks}.
example.more-readings-of-the-line=And {more} more readings of the line.
example.the-construct-that-draws-the-line=Where {construct} draws that line.
example.a-row-just-inside-shows-the-border-is-not-further-in=A row at the nearest value the border keeps in is what shows the border does not fall a step further in.
example.a-row-just-outside-shows-the-border-is-not-further-out=A row at the nearest value the border keeps out is what shows it does not fall a step further out.
example.no-row-is-at-the-point-away-from-the-border-a-rule-drew=No row is at an {point} point of {at}, {value}, away from the border {rule} draws.
example.no-row-is-at-the-point-away-from-the-line-a-rule-drew=No row is at an {point} point away from the line {rule} draws.
example.no-row-is-at-the-point-away-from-the-line-a-construct-drew=No row is at an {point} point away from the line {construct} draws.
example.a-row-well-inside-shows-the-border-is-what-divides=A row well inside is what shows the border, and not something else about the value, is what divides the two.
example.a-row-well-outside-shows-the-border-is-what-divides=A row well outside is what shows the border, and not something else about the value, is what divides the two.
example.no-row-is-in-that-class=No row is in the class `{className}` at {at} in `{behavior}`.
example.write-a-row-whose-value-there-is-in-that-class=Write a row whose {at} is a value the model puts in `{className}`.
example.no-row-goes-through-that-arm=No row goes through {arm} in `{behavior}`.
example.either-a-row-is-missing-or-nothing-reaches-it=Either a row is missing for what this arm answers, or nothing reaches it — which an `unreachable` states.
example.a-row-at-that-arm-awaits-its-answer=A row goes through {arm} in `{behavior}` with its answer still to be written.
example.replace-the-mark-with-what-the-system-answers=Replace the row's `<?>` with what the system answers for those inputs.
example.the-rows-answer-is-owed=A row of `{behavior}` is written with its answer still to be written.
example.the-named-rows-answer-is-owed=Row `{row}` of `{behavior}` is written with its answer still to be written.

# --- totality (E2001, size-change termination) ---
check.totality.title=TOTALITY
behavior.not-structurally-recursive=Recursive helper `let {helper}` is not structurally recursive: it passes no argument that is a strictly smaller part of a parameter. Recurse on a part obtained by `match` (a field or a case), count with `fold`, or mark the helper `partial`.
behavior.not-size-change-terminating=Recursive helpers {helpers} are mutually recursive but not size-change terminating: no argument strictly decreases around every recursive cycle. Recurse on a strictly smaller part obtained by `match` (a field or a case), or mark them `partial` to opt out — each member needs the word, since each reaches the others.
behavior.too-complex-to-prove-total=Recursion {helpers} is too complex to prove total by size-change analysis; mark them `partial` to opt out.
behavior.it-reaches-a-partial-helper=`let {helper}` does not carry the termination guarantee it claims: it reaches the `partial` helper `{partial}` ({through}). Mark `{helper}` `partial` as well, or stop reaching it.
behavior.a-partial-helper-is-written-where-a-value-goes=The `partial` helper `{helper}` is written where a value goes. A function type carries no termination guarantee, so a `partial` helper may be applied but not handed over.

# --- invariant discharge (E2010 error, E2011 warning) ---
check.invariant.title=INVARIANT

# --- fake (E1908-E1909, E1921, E1932, test doubles for injected dependencies) ---
example.a-fake-names-no-behavior=`{named}` is no behavior in scope, so there is nothing for this to stand in for.
example.more-than-one-fake-stands-in-for-one-behavior=More than one `fake` block stands in for `{behavior}`, so none of them does.
example.write-the-rows-as-one-fake=write the rows of every `fake` block for `{behavior}` as one block
example.another-fake-stands-in-for-it-here=another `fake` for `{behavior}` is written here
example.a-dependency-has-no-fake=`{behavior}` depends on `{dependency}`, but no fake was supplied for it.
example.a-dependency-reached-through-has-no-fake=`{behavior}` depends on `{dependency}` through {through}, but no fake was supplied for it.
example.write-a-fake-like-this={shown}
example.the-fake-value-could-not-be-built=The fake value supplied for dependency `{dependency}` could not be built: {why}
example.the-fake-could-not-be-built=The fake supplied for dependency `{dependency}` could not be built: {why}
example.an-earlier-row-answers-these-arguments=An earlier row of `fake {fake}` states these arguments, so that is what the table answers with and this row answers nothing.
example.a-later-default-row-answers-instead=A later `_` row of `fake {fake}` is what the table falls through to, so this one answers nothing.
example.the-row-that-answers-is-here=the row `fake {fake}` answers with
example.a-fake-had-no-output-for-an-input=A fake had no output for an input: {input}
example.a-row-does-not-keep-what-the-behavior-states=The values this row states do not keep what `{target}` declares of what it answers: {why}
example.a-fake-row-does-not-keep-what-the-dependency-states=The values this row stands in with do not keep what `{dependency}` declares of what it answers: {why}
example.an-implementation-does-not-keep-what-the-behavior-states=The implementation supplied for `{target}` answered this row's input with a value that does not keep what `{target}` declares of what it answers: {why}
example.the-declaration-is-what-says-what-it-answers=An `ensures` says what `{target}` answers, so a row stating otherwise records something it will not do. Either the values are wrong or the clause is.
example.the-answer-is-of-another-build=What answers `{target}` was built against another revision of `{module}`: `{declaration}` is declared differently there.
example.build-what-answers-it-against-this-revision=Build it against this revision of `{module}`, or compile this model against what built it.
example.build-what-answers-it-against-a-path-that-carries=Build what answers it against a class path that carries `{module}`.
example.whether-the-answer-is-of-this-module-cannot-be-told=Whether what answers `{target}` was built against `{module}` cannot be told.
example.its-classes-carry-no-declarations=`{module}` publishes no declarations on the classes it brings.
example.what-it-published-cannot-be-read-here=What `{module}` published cannot be read by this compiler.
example.it-did-not-say-which-build-it-reads-by=What answers it did not say which build's declarations of `{module}` it reads a row's values by.
example.this-compile-cannot-read-its-own-declarations-of=This compile cannot read the declarations of `{module}` on its own side, so there was nothing to hold the answer against.
example.the-row-and-the-fake-disagree=This row and the `fake {behavior}` row state different answers for the same input.
example.what-the-row-says-and-what-the-fake-says=The row says {row}; the fake says {fake}.
example.the-fake-row-is-here=the `fake {behavior}` row
example.the-row-and-the-with-disagree=This row and the `with {behavior}` state different answers for the same input.
example.what-the-row-says-and-what-the-with-says=The row says {row}; the `with` says {with}.
example.the-with-is-here=the `with {behavior}`

# --- souther run (the command line drives one behavior; not compile errors) ---
run.usage.line=usage: souther run <file.sou> [-cp <path>] [--behavior <name>] [--input <json>]
run.usage.singlefile=run takes a single .sou file
run.usage.nofile=no source file given
run.usage.optionvalue=`{0}` needs a value
run.behavior.none=no behavior in this module can be run. `run` runs a behavior that is runnable — implemented in Souther and needing nothing injected, a `>->` pipeline when every stage is — and that the module exposes.
run.behavior.several=several behaviors can be run — pick one with --behavior: {0}
run.behavior.runnable=`{0}` is runnable. Available to run: {1}.
run.behavior.noimpl=`{0}` has no implementation (it is injected from Java). Available to run: {1}.
run.behavior.unwritten=`{0}` declares what it depends on and has no `let` yet, so there is nothing to run. Available to run: {1}.
run.behavior.depends=`{0}` depends on injected dependencies ({1}), which `run` cannot supply. Available to run: {2}.
run.behavior.unknown=no behavior named `{0}`. Available to run: {1}.
run.behavior.notexposed=`{0}` is not exposed, and `run` drives a behavior the module exposes — add it to `exposing`. Available to run: {1}.
run.behavior.failed=`{0}` failed: {1}
run.behavior.unreachable=`{0}` could not be started — the compiled `{1}` is not reachable: {2}. This is a defect in the compiler, not in the module.
run.pipeline.noimpl=`{0}` is a pipeline whose stage `{1}` has no implementation (it is injected from Java), which `run` cannot supply. Available to run: {2}.
run.pipeline.depends=`{0}` is a pipeline whose stage `{1}` depends on injected dependencies ({2}), which `run` cannot supply. Available to run: {3}.
run.input.missing=`{0}` takes {1} input(s) — pass --input
run.input.notarray=`{0}` takes {1} inputs — --input must be a JSON array of that length
run.input.count=`{0}` takes {1} inputs, but --input has {2}
run.input.wrapped=This behavior has one parameter. Pass its value directly to --input; remove the outer array.
run.input.badjson=--input is not valid JSON: {0}
run.input.toodeep=--input nests deeper than this boundary accepts: {0} and below (JSON nesting past {1} levels). One level of a data can spend more than one level of JSON.
run.decode.failed=input #{0} could not be decoded — {1}
run.read.failed=cannot read {0}: {1}
run.output.json=could not render the output as JSON: {0}
run.output.toodeep=the output nests deeper than this boundary can render: {0} and below (JSON nesting past {1} levels). One level of a data can spend more than one level of JSON.
run.encode.toodeep=the output nests too deeply for this boundary to encode.
run.decode.malformed=input #{0} is not shaped like `{1}` — check --input

# a behavior that reaches itself (E1608)
declaration.a-behavior-reaches-itself=`behavior {behavior}` reaches itself: {through}.
declaration.a-behavior-does-not-recurse=A behavior does not recurse, through calls, `depends on` or `>->` stages. Write the recursion as a helper `let`, where it is proven total.


# --- attempted construction (E2012, `if T(v) as x` / `guard T(v) as x`) ---
check.attempt.title=CANNOT ATTEMPT
attempt.this-is-not-a-construction=`as` names the value a construction builds, and this is not a construction.
attempt.write-the-construction-whose-invariant-decides=Write the construction whose invariant decides the branch, or drop the `as` and give a condition.
attempt.the-type-declares-no-invariant=`{data}` declares no invariant, so an attempted construction of it always succeeds and the `else` value is never reached.
attempt.construct-it-directly-or-give-it-an-invariant=Construct `{data}` directly, or give it the invariant that decides the branch.
attempt.nothing-here-is-attempted=These arms answer one invariant clause each, and there is no attempted construction here for them to answer for.
attempt.attempt-the-construction-or-give-the-else-one-value=Attempt the construction (`guard T(v) as x else ...`), or give the `else` one value.
attempt.the-clause-is-answered-twice=The clause `{clause}` is answered twice. An arm is chosen by the clause that failed, so a second arm for it could never be reached.
attempt.no-clause-of-that-name=`{data}` has no invariant clause named `{clause}`.
attempt.the-clauses-that-can-be-answered=The clauses that can be answered by name are: {clauses}. A clause is named where it is declared (`invariant <name> = ...`); one declared without a name is answered by `| _ -> ...`.
attempt.these-clauses-have-no-arm=These clauses of `{data}` have no arm: {clauses}. A failure reaches one arm, so every clause that can fail needs one.
attempt.answer-each-of-them-or-give-the-else-one-value=Answer each of them, or give the `else` one value, which answers any failure.
attempt.unnamed-clauses-are-left-unanswered=`{data}` has invariant clauses declared without a name, and nothing here answers them.
attempt.add-a-catch-all-arm-or-name-them=Add `| _ -> ...` for them, or name them where they are declared.
attempt.the-catch-all-arm-answers-nothing=Every invariant clause of `{data}` is named and answered, so `| _ -> ...` answers nothing.
attempt.drop-the-catch-all-arm=Drop it. It would come back the moment `{data}` declares a clause without a name.

# value cycle
check.value.cycle.title=VALUE CYCLE
name.a-value-reaches-itself=`let {name}` is defined in terms of itself ({through}). A value is substituted where it is named, so a value that reaches itself has nothing to stand for. A helper may recurse because it is lowered to a method; a value has no such form.
module.an-exposed-value-rests-on-what-is-kept=`{exposed}` is exposed, and the `{stands}` it stands for is not.
module.an-exposed-argument-rests-on-what-is-kept=`{exposed}` is exposed, and its argument `{argument}` is a `{type}`, which is not.

# --- what the JVM will hold (E2101, E2102, E2103) ---
e2101.title=A GENERATED METHOD EXCEEDS THE JVM PARAMETER-SLOT LIMIT
declaration.a-data-needs-more-slots-than-a-constructor-holds=`data {data}` needs {needs} JVM parameter slots, but the constructor generated for it takes at most {holds}. An `Int` field is carried as a `long` and takes two slots; every other field takes one.
declaration.split-the-data-and-hold-them-as-fields=Split `{data}` into smaller data and hold them as fields.
declaration.a-behavior-takes-more-parameters-than-apply-holds=`behavior {behavior}` takes {takes} parameters, but the `apply` method generated for it takes at most {holds}.
declaration.group-the-parameters-into-a-data=Group the parameters into a data and take that instead.
declaration.a-behavior-has-more-dependencies-than-a-constructor-holds=`behavior {behavior}` is built with {has} dependencies, but the constructor generated for it takes at most {holds}.
declaration.group-the-dependencies-behind-a-behavior=Group them behind a behavior that composes them, and depend on that instead.
declaration.a-helper-takes-more-parameters-than-a-method-holds=`let {helper}` takes {takes} parameters, but the method generated for it takes at most {holds}.
e2102.title=A GENERATED METHOD EXCEEDS THE JVM CODE-SIZE LIMIT
declaration.a-method-is-larger-than-the-jvm-holds=The `{method}` method generated for `{owner}` is {bytes} bytes of code, but a JVM method holds at most {holds}.
declaration.split-the-work-or-move-the-table=Split the work into another behavior, which is emitted as a class of its own, or move the table out of the source. Naming parts with `let` does not divide it: a non-recursive helper is inlined before it is emitted.
e2103.title=A GENERATED CLASS EXCEEDS THE JVM CONSTANT-POOL LIMIT
e2104.title=SOURCE TOO DEEP
e2108.title=THE COMPILER RAN OUT OF ROOM
declaration.the-compiler-ran-out-of-room=I ran out of room working on this. What a source may nest and what a definition may say are both bounded, and a source past either is refused with the place it happened, so this is not a report about the source: on the stack this compiler is supported on, something it built went deeper than anything it accepted should. Either the stack it was given is smaller than that, or this is a shape the bounds do not hold yet.
e2107.title=A DEFINITION IS MORE COMPLEX THAN THE COMPILER HOLDS
declaration.a-block-takes-more-structural-steps-than-a-definition-holds=This block takes {steps} structural steps, and a definition holds at most {holds}. Everything a statement is followed by is written inside what that statement introduced, so each step is a level — a `guard` binds nothing and is one all the same.
declaration.a-definition-is-more-structure-than-is-held=`let {definition}` is {costs} levels of structure, and a definition holds at most {holds}.
declaration.substituting-a-value-is-more-structure-than-is-held=Substituting `{value}` here takes this past {holds} levels of structure, which is what a definition holds. A value is substituted where it is named, so what it is worth is added to what names it.
declaration.write-it-as-a-behavior-of-its-own=Write the part that says the most as a behavior of its own: a behavior is a definition of its own, and counted on its own. Naming parts with `let` does not reduce this — a block's statements and a value's substitution are both counted.
declaration.a-class-refers-past-the-constant-pool=The class generated for `{owner}` refers to constant-pool entry {refersTo}, and a class file addresses at most {holds}. The pool holds every name, type and literal the class refers to.
declaration.a-class-needs-more-constants-than-it-holds=The class generated for `{owner}` needs {needs} constant-pool entries, and a class file holds at most {holds}. The pool holds every name, type and literal the class refers to.
declaration.move-the-table-out-of-the-source=Move the table out of the source, or split the work into another behavior, whose constants belong to a class of its own.

example.the-table-spent-its-steps=Building the `fake {fake}` table spent its budget of {budget} steps, so nothing it states was checked.
example.the-table-goes-round-too-many-times=A row of the table applies a helper that goes round more times than an example is allowed. Bound it, or reduce what the row builds. Until then, whether the `fake {fake}` table can be built at all is unknown.
example.the-table-reached-its-depth-limit=Building the `fake {fake}` table reached the recursion depth limit of {limit}, so nothing it states was checked.
example.the-table-recurses-too-deeply=A helper the table applies recurses deeper than an example is allowed to. Make it structural, or reduce what the row builds. Until then, whether the `fake {fake}` table can be built at all is unknown.
example.the-table-did-not-answer=Building the `fake {fake}` table did not answer within {within}ms, so nothing it states was checked.
example.the-table-not-answering-is-not-the-table-being-wrong=This is the evaluation failing to answer, not the table failing to build: what did not come back was work of the compiler's own that the counted limits do not reach, so nothing here says the `fake {fake}` table is wrong.
example.not-compared-the-table-spent-its-steps=Could not compare this fake with the rows recorded for `{behavior}` — building the table spent its budget of {budget} steps.
example.the-table-compared-goes-round-too-many-times=A row of the table applies a helper that goes round more times than an example is allowed. Bound it, or reduce what the row builds. Until then, whether this fake and the `example {behavior}` rows agree is unknown.
example.not-compared-the-table-reached-its-depth-limit=Could not compare this fake with the rows recorded for `{behavior}` — building the table reached the recursion depth limit of {limit}.
example.the-table-compared-recurses-too-deeply=A helper the table applies recurses deeper than an example is allowed to. Make it structural, or reduce what the row builds. Until then, whether this fake and the `example {behavior}` rows agree is unknown.
example.not-compared-the-table-did-not-answer=Could not compare this fake with the rows recorded for `{behavior}` — building the table did not answer within {within}ms.
example.not-answering-is-not-two-answers=This is the evaluation failing to answer, not the model saying two different things: what did not come back was work of the compiler's own that the counted limits do not reach, so nothing here says the fake and the `example {behavior}` rows disagree.

example.the-evaluation-did-not-answer=The evaluation of this row did not answer within {within}ms and was given up on.
example.not-answering-is-not-not-terminating=This is the compiler failing to decide, not the model failing to terminate: what did not come back was not counted, so nothing here says the row would not have held. The wait is over the compiler's own work — a class it loaded, a value it decoded, a module read from a jar — and not over what an implementation supplied from Java spends answering.
example.the-stack-ran-out-before-the-depth-limit=The evaluation of this row ran out of JVM stack ({stack}) before reaching its recursion-depth limit of {limit}.
example.the-depth-limit-is-what-should-stop-it=The depth limit is what is meant to stop a recursion, and the stack got there first. Lower the depth limit, give the evaluation a larger stack, or rewrite the helper as tail recursion so it loops instead of adding frames.

example.the-table-ran-out-of-stack=Building the `fake {fake}` table ran out of JVM stack before reaching its recursion-depth limit of {limit}, so nothing it states was checked.
example.the-stack-got-there-first=The depth limit is what is meant to stop a recursion, and the stack got there first. Lower the depth limit, give the evaluation a larger stack, or rewrite the helper the `fake {fake}` table applies as tail recursion.
example.not-compared-the-table-ran-out-of-stack=Could not compare this fake with the rows recorded for `{behavior}` — building the table ran out of JVM stack before reaching its recursion-depth limit of {limit}.
example.the-stack-got-there-first-when-comparing=The depth limit is what is meant to stop a recursion, and the stack got there first. Lower the depth limit, give the evaluation a larger stack, or rewrite the helper the table applies as tail recursion. Until then, whether this fake and the `example {behavior}` rows agree is unknown.

example.the-evaluation-spent-its-steps=The evaluation of this row did not finish within its budget of {budget} steps.
example.spending-the-budget-is-not-diverging=What the counting shows is that the evaluation did not finish, not that the model does not: a `partial` recursion that never stops reaches this, and so does one that would have stopped shortly after. If the model does finish and needs more, raise `souther.example.step.limit`; otherwise bound the loop or make the recursion structural.
example.the-evaluation-reached-its-depth-limit=The evaluation of this row reached its recursion-depth limit of {limit}.
example.reaching-the-depth-limit-is-not-diverging=What the counting shows is that the recursion went deeper than the limit, not that it never bottoms out. If the data really is that deep, raise `souther.example.recursion.depth`; otherwise recurse on a part of the argument so it bottoms out.
# --- where a report's caret stands in for code this compile has no source for ---
written-at.the-code-is-written-out-of-sight=The code is written in `{declaration}`, which this compile has no source for, so this is where it was reached from and not where it is.
written-at.the-code-is-written-where-this-compile-cannot-show-it=The code is written in `{declaration}`, which this compile has no source for, so there is nowhere here to point at.

cli.help.command=`souther` has no command `{0}`
cli.help.arguments=`souther help` is written about one command; it was given {0}

# --- an `unreachable` at a case the model admits (E1326) ---
check.unreachable.title=UNREACHABLE CASE ADMITTED
unreachable.the-model-admits-this-case=`{caseName}` can arrive at `{position}`, so this point is reachable.
unreachable.it-is-a-case-of=`{caseName}` is a case of `{type}`, and no rule refuses it here.
unreachable.answer-a-value-or-change-the-input=Where the combination is one the model admits as input, the arm answers a value or the input types change; `unreachable` is for what the model rules out.
# --- a branch the model's own rules make dead (E1327) ---
check.dead.branch.title=BRANCH NOTHING REACHES
dead-branch.nothing-reaches-this-branch=Nothing the model admits arrives at this branch, so no row can be written through it.
dead-branch.the-conditions-on-the-way-here-cannot-all-hold=The conditions on the way here cannot all hold: {conditions}.
dead-branch.the-position-stops-short-of-it=`{position}` holds {admits}, so the values this branch is written for are not values it can hold.
dead-branch.every-case-it-is-written-for-is-refused=No rule leaves `{position}` a value of {cases}, so no value of them arrives here.
dead-branch.take-it-out-or-let-something-reach-it=Take the branch out, or widen what reaches it — a rule that rules it out is a rule about the model, not about this branch.
