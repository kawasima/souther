# Diagnostic message catalog — English base.
# A key missing from another catalog falls back here. That is a fail-safe: every catalog that
# ships defines every key this one defines, and the build holds it to that.
# Codes are the stable identity; titles/messages/hints are prose and may be localized.
#
# Two grammars, and which one an entry is written in is decided by its key.
#
# An entry a message owns — its key is the message's area and name, as `data.not-a-field-of` — is
# filled by name: `{field}` takes the value the message carries under that name. The build holds
# such an entry to naming every value its message carries and to naming nothing else, so a brace
# holding anything but a value's name is refused rather than shown. A brace and an apostrophe are
# themselves here: there is no quoting to undo.
#
# What is left keyed is not a diagnostic: `run.*` is what the `run` subcommand answers a shell with,
# and `tok.*`, `kind.*` and `diag.*` are phrases written into the sentences above. Those are
# MessageFormat patterns filled by position.
diag.error.title=ERROR
diag.warning.title=WARNING
diag.hint.label=Hint:
diag.diff.found=It is:
diag.diff.expected=But it needs to be:
diag.suggestion=did you mean `{0}`?

