cli.init.verb.created=created
cli.init.verb.kept=kept
cli.init.verb.edited=edited
cli.init.verb.detected=detected
cli.init.verb.read=read
cli.init.pom.unreadable={0} is not a pom this command can follow: an end tag there closes something other than what is open. Add the plugin and the runtime by hand, or fix the tags.
cli.init.build.ambiguous=this directory holds a {0} and a {1}, and which build a model belongs to is not for this command to decide. Run it where one build is.
cli.init.gradle.elsewhere={0} names the Souther plugin outside its `plugins` block, or asks for it with `apply false`. Apply it there, or add the declaration by hand: a second request for a plugin already requested is one Gradle refuses.
cli.init.module=module {0}
cli.init.orig=the previous contents are in {0}
cli.init.gradle=`gradle` is not on the PATH: install Gradle, or run `gradle wrapper` where one is.
cli.init.arguments=`souther init` takes one coordinate; it was given {0}.
cli.init.coordinate.required=`souther init` needs a coordinate written as {0}: a group and an artifact are decided by a person, and neither a directory name nor a git remote decides them.
cli.init.coordinate.form=`{0}` is not a coordinate. Write it as {1}.
cli.init.coordinate.declared=this directory already holds a build, and the coordinate is read from it rather than written on the line; it was given `{0}`.
cli.init.coordinate.unreadable={0} does not say what this project is called. Add the coordinate to it, or run this where a build states one, written as {1}.
cli.init.build.decided=`--build` says which build to write, and this directory already holds a {0} build.
cli.init.module.underivable=no module name follows from `{0}`. Write one with `--module`.
cli.init.module.name=`{0}` is not a module name. A module is written as names separated by dots.
cli.init.module.reserved=`{0}` is in the namespace the language reserves for itself. Write another with `--module`.
cli.init.version=this Souther is running from class files and has no version, so there is no version to write into a build file. Run a released one.
cli.init.io=io error: {0}

